<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alfabeto Embaralhado</title>
<meta name="description" content="Monte seu time de futebol com as letras que o quadro te der. Jogue online com os amigos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: estádio à noite — coluna única no celular; no desktop, quadro + ações à esquerda e campo à direita */
:root{
  --night:#0c1712; --panel:#13241b; --panel2:#1a3026; --grass:#1d5a3a; --grass2:#226643;
  --chalk:#eef3ea; --muted:#9db3a4; --line:rgba(238,243,234,.42);
  --gold:#e6b84c; --gold-hi:#f6d98a; --gold-deep:#8a6519; --ink:#1b1406;
  --flag:#ff6a3d; --ok:#5fd38d; --bad:#ff7a7a;
  --f-display:"Anton","Impact","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-label:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--chalk);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
#app{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.02em;text-wrap:balance;margin:0}
.lbl{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--muted);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input{font:inherit;color:var(--chalk);background:var(--night);border:1px solid #2c4a3a;border-radius:10px;padding:11px 12px;width:100%;min-width:0}
input::placeholder{color:#6f8a79}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;background:var(--panel2);border:1px solid #2c4a3a}
.btn.gold{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--ink);border-color:var(--gold-deep)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--panel);border:1px solid #223a2e;border-radius:14px;padding:16px}
.err{color:var(--bad);font-weight:600;min-height:1.2em}
.note{color:var(--muted);font-size:14px}

/* Home */
.hero{padding:18px 0 8px}
.hero h1{font-size:clamp(44px,11vw,88px);line-height:.92;text-transform:uppercase}
.hero h1 .scr{display:inline-flex;gap:4px;flex-wrap:wrap}
.hero h1 .scr span{display:inline-block;background:var(--chalk);color:var(--night);padding:0 .08em;border-radius:6px;transform:rotate(var(--r))}
.hero p{max-width:60ch;color:var(--muted);margin:12px 0 0}
.home-grid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:20px}
@media (min-width:820px){.home-grid{grid-template-columns:1.1fr .9fr}}
.rules ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:62ch}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:#2c4a3a}

/* Topbar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.code{font-family:var(--f-display);font-size:28px;letter-spacing:.14em;background:var(--chalk);color:var(--night);padding:2px 12px;border-radius:8px}
.turn{border-radius:14px;padding:14px 16px;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid #223a2e}
.turn.mine{background:linear-gradient(90deg,rgba(255,106,61,.22),rgba(255,106,61,.05));border-color:var(--flag)}
.turn h2{font-size:26px}

/* Tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.tab{flex:0 0 auto;border:1px solid #2c4a3a;background:var(--panel);border-radius:999px;padding:7px 14px;font-weight:600;display:flex;gap:8px;align-items:center}
.tab[aria-pressed="true"]{background:var(--chalk);color:var(--night);border-color:var(--chalk)}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--flag)}
.tab small{font-family:var(--f-label);font-weight:700;opacity:.75}

.game{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:860px){.game{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}

/* Board of numbers */
.board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.tile{aspect-ratio:1;border-radius:9px;border:1px solid #2f5140;background:repeating-linear-gradient(135deg,#1f3a2d 0 6px,#1b3428 6px 12px);
  font-family:var(--f-display);font-size:clamp(16px,4.6vw,22px);display:grid;place-items:center;color:var(--chalk);padding:0}
.tile:not(:disabled):hover{border-color:var(--gold);transform:translateY(-1px)}
.tile.open{background:var(--chalk);color:var(--night);border-color:var(--chalk)}
.tile.open.cur{background:var(--flag);border-color:var(--flag);color:#fff}
.tile.open.used{opacity:.55}
.tile:disabled{cursor:default}

/* Action */
.action{display:flex;flex-direction:column;gap:12px}
.bigletter{font-family:var(--f-display);font-size:64px;line-height:1;width:84px;height:84px;display:grid;place-items:center;border-radius:14px;background:var(--flag);color:#fff;flex:0 0 auto}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.card{position:relative;border:0;padding:12px 6px 14px;background:linear-gradient(170deg,var(--gold-hi),var(--gold) 55%,#c99a33);color:var(--ink);
  clip-path:polygon(50% 0,100% 9%,100% 86%,50% 100%,0 86%,0 9%);display:flex;flex-direction:column;align-items:center;gap:4px;min-height:104px}
.card svg{width:30px;height:30px}
.card b{font-family:var(--f-label);text-transform:uppercase;font-size:13px;line-height:1.05;letter-spacing:.03em}
.card[aria-pressed="true"]{background:linear-gradient(170deg,#fff,var(--gold-hi))}
.card:disabled{filter:grayscale(.8);opacity:.45;cursor:not-allowed}
.uses{display:flex;gap:6px;align-items:center}
.uses i{width:12px;height:12px;border-radius:3px;background:var(--gold);display:inline-block}
.uses i.off{background:#2c4a3a}
.letters{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px}
.letters button{border:1px solid #2c4a3a;background:var(--panel2);border-radius:7px;padding:7px 0;font-family:var(--f-display);font-size:18px}

/* Pitch */
.pitch{position:relative;width:100%;aspect-ratio:68/88;border-radius:14px;overflow:hidden;
  background:repeating-linear-gradient(180deg,var(--grass) 0 11.1%,var(--grass2) 11.1% 22.2%);border:2px solid #2d7a52}
.pitch .ln{position:absolute;border:2px solid var(--line);pointer-events:none}
.pitch .half{left:0;right:0;top:50%;border-width:2px 0 0}
.pitch .circ{left:50%;top:50%;width:26%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%)}
.pitch .boxT{left:24%;right:24%;top:-2px;height:15%}
.pitch .boxB{left:24%;right:24%;bottom:-2px;height:15%}
.slot{position:absolute;transform:translate(-50%,-50%);width:23%;min-height:44px;border-radius:10px;border:1.5px dashed rgba(238,243,234,.55);
  background:rgba(12,23,18,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 3px;text-align:center;gap:1px}
.slot .pos{font-family:var(--f-label);font-weight:700;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.slot .nm{font-weight:700;font-size:12px;line-height:1.1;word-break:break-word;color:var(--chalk)}
.slot .lt{position:absolute;top:-8px;right:-6px;background:var(--chalk);color:var(--night);font-family:var(--f-display);font-size:12px;border-radius:5px;padding:0 4px}
.slot.full{border-style:solid;border-color:var(--chalk);background:rgba(12,23,18,.82)}
.slot.can{border-color:var(--gold);border-style:solid;box-shadow:0 0 0 3px rgba(230,184,76,.25)}
.slot.can.full{border-color:var(--flag);box-shadow:0 0 0 3px rgba(255,106,61,.3)}
.slot:disabled{cursor:default}
.slot.off{border-color:var(--gold);border-style:dashed}
.slot.off .pos{color:var(--gold)}
.cmpwrap{overflow-x:auto}
.cmp{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}
.cmp th,.cmp td{text-align:left;padding:8px 10px;border-bottom:1px solid #223a2e;vertical-align:top}
.cmp thead th{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-size:12px}
.cmp tbody th{font-family:var(--f-label);color:var(--muted);font-weight:700;width:60px}
.cmp td.offp{color:var(--gold)}
.cmp td small{font-size:11px}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{border:1px solid #2c4a3a;background:var(--panel2);border-radius:9px;padding:6px 10px;text-align:left;display:flex;flex-direction:column;line-height:1.15;max-width:100%}
.sugg button b{font-weight:700;font-size:14px}
.sugg button small{font-size:11.5px;color:var(--muted)}
.sugg button.fit{border-color:var(--ok)}
.fit{display:block;font-size:13.5px;font-weight:600}
.fit.ok{color:var(--ok)} .fit.off{color:var(--gold)} .fit.unk{color:var(--muted)}
.slot.aim{border-color:var(--flag);border-style:solid;background:rgba(255,106,61,.35);box-shadow:0 0 0 3px rgba(255,106,61,.35)}
.tile{position:relative}
.cbadge{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:6px;background:linear-gradient(170deg,var(--gold-hi),var(--gold));color:var(--ink);display:grid;place-items:center;border:1px solid var(--gold-deep)}
.cbadge svg{width:14px;height:14px}
.tile.cardtile{background:linear-gradient(170deg,var(--gold-hi),var(--gold));color:var(--ink);border-color:var(--gold-deep)}
.tile svg{width:60%;height:60%}
.card small{font-size:11px;font-weight:600;opacity:.8}
.mini .slot{min-height:34px;width:24%}
.mini .slot .nm{font-size:10.5px}
.mini .slot .pos{font-size:9px}

.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted)}
.log li b{color:var(--chalk)}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.team h3{font-size:24px}
.votes{font-family:var(--f-display);font-size:22px;color:var(--gold)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.plist li{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--panel2);border-radius:10px;padding:10px 12px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--chalk);color:var(--night);padding:10px 16px;border-radius:10px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const POS_NAME = {GOL:"goleiro", LD:"lateral-direito", LE:"lateral-esquerdo", ZAG:"zagueiro", VOL:"volante", MC:"meio-campista", MEI:"meia", PE:"ponta-esquerda", PD:"ponta-direita", CA:"centroavante"};
const SLOT_OK = {gol:["GOL"], ld:["LD"], le:["LE"], zg1:["ZAG"], zg2:["ZAG"], vol:["VOL","MC"], mc1:["MC","MEI","VOL"], mc2:["MC","MEI","VOL"], pe:["PE","PD"], pd:["PD","PE"], ca:["CA"]};
const normName = s => (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const PL = [], PALIAS = new Map();
PDATA.split("\n").forEach((ln,i) => {
  const [ns, ps] = ln.split("|"); if(!ns) return;
  const e = { key:"p"+i, names:ns.split("/"), pos:(ps||"").split(",") };
  e.norms = e.names.map(normName);
  PL.push(e); e.norms.forEach(n => { if(!PALIAS.has(n)) PALIAS.set(n, e); });
});
/* sobrenome sozinho vale como apelido, se só um jogador da lista tiver esse sobrenome */
(() => {
  const PART = new Set(["de","da","do","dos","das","di","van","von","der","den","del","la","le","el","jr","junior","filho","neto"]);
  const cnt = new Map(), owner = new Map();
  PL.forEach(e => new Set(e.names.map(n => { const w=normName(n).split(" "); return w.length>1 && !PART.has(w[w.length-2]) ? w[w.length-1] : null; }).filter(x => x && x.length>=3 && !PART.has(x))).forEach(sn => { cnt.set(sn,(cnt.get(sn)||0)+1); owner.set(sn,e); }));
  cnt.forEach((c,sn) => { if(c!==1 || PALIAS.has(sn)) return; const e=owner.get(sn);
    const orig = e.names.map(n=>n.split(" ")).find(w=>w.length>1 && normName(w[w.length-1])===sn);
    const nm = orig ? orig[orig.length-1] : sn; e.names.push(nm); e.norms.push(sn); PALIAS.set(sn, e); });
})();
const lookup = name => PALIAS.get(normName(name)) || null;
const playerKey = name => lookup(name)?.key || "x:" + normName(name);
const fits = (e, slot) => !!e && e.pos.some(x => SLOT_OK[slot]?.includes(x));
const posText = e => e.pos.map(x => POS_NAME[x]).join(" / ");
function usedKeys(){ const k=new Set(); for(const id of S.room.order){ const t=S.room.players[id].team||{}; for(const s in t) k.add(playerKey(t[s].n)); } return k; }
function suggestions(letter, draft, slot){
  const q = normName(draft), used = usedKeys(), out = [];
  for(const e of PL){
    if(used.has(e.key)) continue;
    let best = -1;
    e.norms.forEach((n,i) => { if(n.charAt(0).toUpperCase()!==letter) return; if(q && !n.startsWith(q) && !n.includes(" "+q)) return; if(best<0) best=i; });
    if(best<0) continue;
    out.push({ e, name:e.names[best], fit:fits(e, slot) });
  }
  out.sort((a,b) => (b.fit-a.fit) || a.name.localeCompare(b.name, "pt"));
  return out.slice(0, 8);
}
function suggHTML(p){
  const pend=p.pending; if(!pend || !p.aim) return "";

}
function fitHTML(p){

/* ---------- stores ---------- */
/* Anfitrião: guarda o estado da sala e repassa para todos os conectados */
function hostStore(pr){
  let data=null, ls=[]; const conns=new Set();
  const emit = () => { ls.forEach(f=>f(clone(data),{fromCache:false})); conns.forEach(c=>{ try{ c.open && c.send({type:"state", d:data}); }catch(e){} }); };
  pr.on("connection", c => {
    c.on("open", () => { conns.add(c); c.send({type:"state", d:data}); });
    c.on("data", m => { if(!m || !data) return; if(m.type==="patch" && isObj(m.d)){ data=merge(data, m.d); emit(); } });
    c.on("close", () => conns.delete(c));
    c.on("error", () => conns.delete(c));
  });
  return {
    get: async () => clone(data),
    set: async d => { data=clone(d); emit(); },
    update: async d => { data=merge(data, clone(d)); emit(); },
    listen: cb => { ls.push(cb); setTimeout(()=>cb(clone(data),{fromCache:false})); return () => { ls=ls.filter(x=>x!==cb); }; }
  };
}
/* Convidado: recebe o estado do anfitrião e manda as jogadas para ele */
function guestStore(conn, first){
  let data=first, ls=[];
  conn.on("data", m => { if(m && m.type==="state"){ data=m.d; ls.forEach(f=>f(clone(data),{fromCache:false})); } });
  conn.on("close", () => { S.ui.net = "Caiu a conexão com o anfitrião da sala. Saia e entre de novo com o mesmo código."; render(); });
  return {
    get: async () => clone(data),
    set: async d => { conn.send({type:"patch", d}); },
    update: async d => { if(!conn.open) throw new Error("closed"); conn.send({type:"patch", d}); },
    listen: cb => { ls.push(cb); setTimeout(()=>cb(clone(data),{fromCache:false})); return () => { ls=ls.filter(x=>x!==cb); }; }
  };
}
function openPeer(id){
  return new Promise((res, rej) => {
    if(!window.Peer) return rej({type:"no-lib"});
    const p = id ? new Peer(id) : new Peer();
    const t = setTimeout(()=>{ try{p.destroy();}catch(e){} rej({type:"timeout"}); }, 12000);
    p.on("open", () => { clearTimeout(t); res(p); });
    p.on("error", e => { clearTimeout(t); rej(e); });
  });
}
function localStore(){
  let data=null, ls=[];
  const emit = () => ls.forEach(f => f(clone(data), {fromCache:false}));
  return {
    get: async () => clone(data),
    set: async d => { data = clone(d); emit(); },
    update: async d => { data = merge(data, clone(d)); emit(); },
    listen: cb => { ls.push(cb); setTimeout(()=>cb(clone(data),{fromCache:false})); return () => { ls = ls.filter(x=>x!==cb); }; }
  };
}

function subscribe(){
  if(unsub) unsub();
  clearTimeout(netTimer);
  S.ui.net = "";
  netTimer = setTimeout(()=>{ S.ui.net = "Ainda não consegui falar com a sala. Verifique a conexão."; render(); }, 10000);
  unsub = store.listen((data, meta) => {
    if(!meta?.fromCache){ clearTimeout(netTimer); S.ui.net=""; }
    if(!data){ return; }
    const prevTurn = S.room?.turn;
    S.room = data;
    if(data.status==="lobby") S.screen="lobby";
    else if(data.status==="playing") S.screen="game";
    else if(data.status==="done") S.screen="done";
    if(prevTurn !== data.turn){ S.ui.pick=null; S.ui.draft=""; if(S.mode==="local") S.view=null; }
    render();
  }, e => { S.ui.net = "A conexão com a sala caiu. Saia e entre de novo."; render(); });
}

  try{ await store.update(patch); }
  catch(e){ toast("Não deu para enviar a jogada. Verifique a conexão."); throw e; }
}
function newCode(){ const L="ABCDEFGHJKLMNPQRSTUVWXYZ"; let c=""; for(let i=0;i<4;i++) c+=L[Math.floor(Math.random()*L.length)]; return c; }

async function createRoom(){
  const name = S.ui.name.trim(); if(!name){ S.ui.err="Digite seu nome."; return render(); }
  lsSet("ae_name", name);
  S.mode="online"; S.ui.err="Criando a sala…"; render();
  let code=null;
  for(let i=0;i<4 && !peer;i++){
    code=newCode();
    try{ peer = await openPeer(PFX+code); }
    catch(e){ if(e?.type!=="unavailable-id"){ S.ui.err="Não consegui criar a sala agora. Verifique a internet e tente de novo."; return render(); } }
  }
  if(!peer){ S.ui.err="Não consegui criar a sala agora."; return render(); }
  peer.on("disconnected", () => { try{ peer.reconnect(); }catch(e){} });
  store=hostStore(peer);
  await store.set({ code, hostId:S.me, status:"lobby", createdAt:Date.now(), cardUses:2,
    players:{[S.me]:{name, joinedAt:Date.now()}}, order:[], turn:null, round:0, log:[], votes:{} });
  S.code=code; S.ui.err=""; subscribe();
}
function connectTo(code){
  return new Promise(async (res, rej) => {
    try{ peer = await openPeer(null); }catch(e){ return rej({type:"net"}); }
    const conn = peer.connect(PFX+code, {reliable:true});
    const t = setTimeout(()=>rej({type:"timeout"}), 12000);
    peer.on("error", e => { clearTimeout(t); rej(e); });
    conn.on("data", function first(m){ if(m && m.type==="state"){ clearTimeout(t); conn.off("data", first); res({conn, room:m.d}); } });
  });
}
async function joinRoom(){
  const name = S.ui.name.trim(); const code = S.ui.joinCode.trim().toUpperCase();
  if(!name){ S.ui.err="Digite seu nome."; return render(); }
  if(code.length!==4){ S.ui.err="O código da sala tem 4 letras."; return render(); }
  lsSet("ae_name", name);
  S.mode="online"; S.ui.err="Procurando a sala…"; render();
  let got;
  try{ got = await connectTo(code); }
  catch(e){
    if(peer){ try{peer.destroy();}catch(x){} peer=null; }

}
function startLocal(){

  S.mode="local"; store=localStore(); S.code=null;

function buildStart(room){
  const r = clone(room);
  const ids = Object.keys(r.players).sort((a,b)=>(r.players[a].joinedAt||0)-(r.players[b].joinedAt||0));
  const order = shuffle(ids);
  ids.forEach(id => {
    const board = shuffle(AL.split(""));
    const cards = Array(26).fill(""), types = shuffle(["repeat","repeat","letter","letter","reroll","reroll"]);
    shuffle([...Array(26).keys()]).slice(0,6).forEach((i,k) => cards[i] = types[k]);
    r.players[id] = { name:r.players[id].name, joinedAt:r.players[id].joinedAt, board, cards, revealed:[], team:{}, hand:[], aim:null, pending:null };
  });
  Object.assign(r, { status:"playing", order, turn:order[0], round:1, votes:{}, log:[{t:Date.now(), text:"Começou! "+r.players[order[0]].name+" abre a partida."}] });
  return r;
}

/* ---------- turn logic ---------- */
const actor = () => S.mode==="local" ? S.room.turn : S.me;
function logPatch(text){ return [...(S.room.log||[]), {t:Date.now(), text}].slice(-30); }
function nextTurnPatch(players){
  const r=S.room, order=r.order, i=order.indexOf(r.turn);
  for(let k=1;k<=order.length;k++){
    const cand = order[(i+k)%order.length];
    if(teamCount(players[cand])<11){ return { turn:cand, round: r.round + ((i+k)>=order.length ? 1 : 0) }; }
  }
  return { status:"done", turn:null };
}
const CARD_NAME = {repeat:"Repetir letra", letter:"Trocar letra", reroll:"Trocar número"};
const validCards = (p, r=S.room) => (p.hand||[]).filter(c => c.r + 1 >= r.round);
const hasCard = (p, t) => validCards(p).some(c => c.t===t);
function useCard(p, t){
  const hand = validCards(p); const i = hand.findIndex(c=>c.t===t);
  if(i<0) return null; hand.splice(i,1); return hand;
}
async function setAim(posId){
  const id=actor(), p=S.room.players[id];
  if(S.room.turn!==id || p.pending) return;
  if(p.team[posId]) return;
  S.ui.draft="";
  await write({ players:{[id]:{ aim:posId }} });
}
async function reveal(idx){
  const id=actor(), p=S.room.players[id];
  if(S.room.turn!==id || p.pending || p.revealed.includes(idx)) return;
  if(!p.aim){ toast("Escolha primeiro a posição no campo."); return; }
  const L=p.board[idx], c=(p.cards||[])[idx], revealed=[...p.revealed, idx];
  const patch = { revealed, pending:{letter:L, idx} };
  if(c) patch.hand = [...validCards(p), {t:c, r:S.room.round}];
  await write({ players:{[id]:patch}, log:logPatch(p.name+" abriu o nº "+(idx+1)+" e tirou a letra "+L+(c?" e a cartinha "+CARD_NAME[c]+"!":"")) });
}
function whoHas(name){
  const k=playerKey(name);
  for(const id of S.room.order){ const t=S.room.players[id].team||{}; for(const x in t){ if(playerKey(t[x].n)===k) return S.room.players[id].name; } }
  return null;
}
async function place(){
  const id=actor(), p=S.room.players[id], pend=p.pending, posId=p.aim;
  if(S.room.turn!==id || !pend || !posId || p.team[posId]) return;
  const name=S.ui.draft.trim();
  if(!name){ toast("Digite o nome do jogador primeiro."); document.getElementById("draft")?.focus(); return; }
  if(firstLetter(name)!==pend.letter){ toast("O nome precisa começar com "+pend.letter+"."); return; }
  const owner=whoHas(name);
  if(owner){ toast(name+" já foi escalado"+(owner===p.name?" no seu time":" pelo "+owner)+". Escolha outro."); return; }
  const posLabel = POS.find(x=>x.id===posId).l;
  const e = lookup(name), ok = e ? fits(e,posId) : null, nm = e ? e.names.find(x=>normName(x)===normName(name)) || name : name;
  const slot = {n:nm, l:pend.letter, ok};
  const players = clone(S.room.players); players[id] = {...p, team:{...p.team, [posId]:slot}, pending:null, aim:null};
  await write({ players:{[id]:{ team:{[posId]:slot}, pending:null, aim:null, hand:validCards(p) }}, log:logPatch(p.name+" escalou "+nm+" ("+posLabel+")"+(ok===false?" fora de posição":"")), ...nextTurnPatch(players) });
}
async function cardReroll(){
  const id=actor(), p=S.room.players[id];
  if(!p.pending) return; const hand=useCard(p,"reroll"); if(!hand) return;
  await write({ players:{[id]:{ pending:null, hand }}, log:logPatch(p.name+" usou Trocar número e descartou a letra "+p.pending.letter+". Abre outro número.") });
}
const pastLetters = p => [...new Set(Object.values(p.team||{}).map(t=>t.l))].sort();
async function cardPick(kind, L){
  const id=actor(), p=S.room.players[id];
  if(!p.aim) return;
  if(kind==="repeat" && !pastLetters(p).includes(L)) return;
  const hand=useCard(p, kind); if(!hand) return;
  S.ui.pick=null;
  const lab=POS.find(x=>x.id===p.aim).l;
  await write({ players:{[id]:{ pending:{letter:L, idx:p.pending?p.pending.idx:-1, via:kind}, hand }}, log:logPatch(p.name+" usou "+CARD_NAME[kind]+" e ficou com a letra "+L+" para o "+lab) });
}
async function freeLetter(L){

async function pass(){

  const players=clone(S.room.players); players[id]={...p, pending:null, aim:null};
  await write({ players:{[id]:{pending:null, aim:null}}, log:logPatch(p.name+" passou a vez"+(p.pending?" com a letra "+p.pending.letter:"")), ...nextTurnPatch(players) });

async function skipTurn(){

  return `<div class="top"><h2 style="font-size:30px">Num aparelho só</h2><button class="btn ghost" data-act="home">Voltar</button></div>
  <div class="panel stack" style="max-width:560px">
    <p class="note">Adicione quem vai jogar. Na vez de cada um, o celular passa de mão em mão.</p>
    <div class="row" style="flex-wrap:nowrap"><input id="localDraft" maxlength="18" placeholder="Nome do jogador" value="${esc(S.ui.localDraft)}"><button class="btn" data-act="addLocal">Adicionar</button></div>
    <ul class="plist">${S.ui.localNames.map((n,i)=>`<li><span>${esc(n)}</span><button class="btn ghost" data-act="rmLocal" data-i="${i}" aria-label="Remover ${esc(n)}">Remover</button></li>`).join("") || '<li class="note">Ninguém ainda.</li>'}</ul>
    <div class="err" role="alert">${esc(S.ui.err)}</div>
    <button class="btn gold" data-act="startLocal" ${S.ui.localNames.length<2?"disabled":""}>Começar partida</button>
  </div>`;
}
function vLobby(){
  const r=S.room, host=r.hostId===S.me;
  const ids=Object.keys(r.players).sort((a,b)=>r.players[a].joinedAt-r.players[b].joinedAt);
  return `<div class="top"><div class="row"><span class="lbl">Sala</span><span class="code">${esc(r.code)}</span></div><button class="btn ghost" data-act="leave">Sair</button></div>
  ${S.ui.net?`<p class="err">${esc(S.ui.net)}</p>`:""}
  <div class="home-grid">
    <div class="panel stack">
      <div><h2 style="font-size:30px">Esperando a galera</h2><p class="note" style="margin:6px 0 0">Passe o código <b>${esc(r.code)}</b> para os amigos. Eles abrem esta mesma página, colocam o nome e entram.</p></div>
      <ul class="plist">${ids.map(id=>`<li><span>${esc(r.players[id].name)}${id===S.me?" (você)":""}</span>${id===r.hostId?'<span class="lbl">anfitrião</span>':""}</li>`).join("")}</ul>
      ${host ? `<button class="btn gold" data-act="start">Começar com ${ids.length} jogador${ids.length>1?"es":""}</button>` : '<p class="note">O anfitrião começa a partida quando todos entrarem.</p>'}
    </div>
    ${rulesHTML()}
  </div>`;
}
function pitchHTML(p, opts={}){
  const {interactive=false, mini=false} = opts;
  const pend = p.pending;
  return `<div class="pitch ${mini?"mini":""}"><div class="ln half"></div><div class="ln circ"></div><div class="ln boxT"></div><div class="ln boxB"></div>
    ${POS.map(pos=>{
      const t=p.team?.[pos.id], aimed = interactive && p.aim===pos.id;
      const can = interactive && !pend && !t;
      return `<button class="slot ${t?"full":""} ${t&&t.ok===false?"off":""} ${can?"can":""} ${aimed?"aim":""}" ${can?`data-act="aim" data-pos="${pos.id}"`:"disabled"} style="left:${pos.x}%;top:${pos.y}%" aria-pressed="${aimed?"true":"false"}" aria-label="${pos.l}${t?": "+esc(t.n):" vazia"}">
        ${t?`<span class="lt">${esc(t.l)}</span>`:""}<span class="pos">${pos.l}${t&&t.ok===false?" · fora":""}</span>${t?`<span class="nm">${esc(t.n)}</span>`:""}${aimed && pend?`<span class="nm">${esc(pend.letter)}…</span>`:""}</button>`;
    }).join("")}</div>`;
}
function boardHTML(p, mine){
  const pend=p.pending;
  return `<div class="board">${p.board.map((v,i)=>{
    const open=p.revealed.includes(i), cur=pend && pend.idx===i, c=open && (p.cards||[])[i];
    const can = mine && !pend && !open && !!p.aim;
    const label = open ? "Letra "+v+(c?" com a cartinha "+CARD_NAME[c]:"") : "Número "+(i+1);
    return `<button class="tile ${open?"open":""} ${cur?"cur":""}" ${can?`data-act="reveal" data-i="${i}"`:"disabled"} aria-label="${label}" title="${label}">${open ? v : i+1}${c?`<span class="cbadge">${CARD_ICONS[c]}</span>`:""}</button>`;
  }).join("")}</div>`;
}
function handHTML(p, mine){
  const hand = validCards(p), r=S.room, pend=p.pending;
  let picker="";
  if(mine && S.ui.pick){
    const opts = S.ui.pick==="repeat" ? pastLetters(p) : AL.split("");
    picker = `<div class="stack" style="gap:6px"><span class="lbl">${S.ui.pick==="repeat"?"Escolha uma letra que você já usou no seu time":"Escolha qualquer letra"}</span>${opts.length?`<div class="letters">${opts.map(X=>`<button data-act="pickL" data-l="${X}">${X}</button>`).join("")}</div>`:'<p class="note" style="margin:0">Você ainda não escalou ninguém, então não tem letra para repetir.</p>'}</div>`;
  }
  if(!hand.length) return `<div class="stack" style="gap:6px"><span class="lbl">Suas cartinhas</span><p class="note" style="margin:0">Nenhuma ainda. Seis números do seu quadro trazem uma cartinha junto com a letra.</p></div>`;
  return `<div class="stack" style="gap:8px"><span class="lbl">Suas cartinhas</span><div class="cards">${hand.map(c=>{
    const usable = mine && !!p.aim && (c.t==="reroll" ? !!pend : (c.t==="repeat" ? pastLetters(p).length>0 : true));
    const act = c.t==="reroll" ? "cReroll" : "cPick";
    const exp = c.r + 1 > r.round ? "vale até a próxima rodada" : "última rodada!";
    return `<button class="card" ${usable?`data-act="${act}" data-k="${c.t}"`:"disabled"} aria-pressed="${S.ui.pick===c.t?"true":"false"}">${CARD_ICONS[c.t]}<b>${CARD_NAME[c.t]}</b><small>${exp}</small></button>`;
  }).join("")}</div>${picker}</div>`;
}
function actionHTML(p){
  if(!p.pending){
    if(!p.aim) return `<div class="panel stack"><h3 style="font-size:24px">1. Escolha a posição no campo</h3><p class="note" style="margin:0">Toque numa posição vazia. Depois você abre um número e escala alguém com a letra que sair.</p>${handHTML(p,true)}</div>`;
    const lab = POS.find(x=>x.id===p.aim).l;
    if(p.revealed.length>=26) return `<div class="panel stack"><div class="lbl">O quadro acabou. Escolha uma letra para ${lab}</div><div class="letters">${AL.split("").map(L=>`<button data-act="free" data-l="${L}">${L}</button>`).join("")}</div></div>`;
    return `<div class="panel stack"><h3 style="font-size:24px">2. Abra um número para ${lab}</h3><p class="note" style="margin:0">Ainda dá para mudar a posição tocando em outra no campo.</p>${handHTML(p,true)}</div>`;
  }
  const L=p.pending.letter, lab=POS.find(x=>x.id===p.aim)?.l||"";
  return `<div class="panel action">
    <div class="row" style="flex-wrap:nowrap;align-items:center"><div class="bigletter">${L}</div>
      <div class="stack" style="gap:6px;flex:1;min-width:0"><label class="lbl" for="draft">${lab} com a letra ${L}</label>
      <input id="draft" maxlength="28" placeholder="Nome começando com ${L}" value="${esc(S.ui.draft)}" autocomplete="off"></div></div>
    <div id="fitnote">${fitHTML(p)}</div>
    <div id="sugg" class="stack" style="gap:6px">${suggHTML(p)}</div>
    <button class="btn gold" data-act="place">Escalar no ${lab}</button>
    ${handHTML(p,true)}
    <button class="btn ghost" data-act="pass">Passar a vez (perde a letra)</button>
  </div>`;
}
function vGame(){
  const r=S.room, me=actor(), turnP=r.players[r.turn];
  const myTurn = r.turn===me;
  const viewId = S.view && r.players[S.view] ? S.view : (r.players[me] ? me : r.turn);
  const vp = r.players[viewId];
  const viewingMine = viewId===me && myTurn;
  const host = S.mode==="online" && r.hostId===S.me;
  return `<div class="top"><div class="row">${r.code?`<span class="lbl">Sala</span><span class="code">${esc(r.code)}</span>`:'<span class="lbl">Partida num aparelho só</span>'}<span class="lbl">Rodada ${r.round}</span></div><button class="btn ghost" data-act="leave">Sair</button></div>
  ${S.ui.net?`<p class="err">${esc(S.ui.net)}</p>`:""}
  <div class="turn ${myTurn?"mine":""}"><div><div class="lbl">${S.mode==="local"?"Passe o celular para":"Agora é a vez de"}</div><h2>${myTurn && S.mode==="online" ? "Sua vez!" : esc(turnP?.name)}</h2></div>
    ${host && !myTurn ? `<button class="btn ghost" data-act="skip">Pular a vez de ${esc(turnP?.name)}</button>` : ""}</div>
  <div class="tabs" role="group" aria-label="Times">${r.order.map(id=>{const p=r.players[id];return `<button class="tab" data-act="view" data-id="${id}" aria-pressed="${id===viewId}">${id===r.turn?'<span class="dot"></span>':""}${esc(p.name)}${id===S.me&&S.mode==="online"?" (você)":""} <small>${teamCount(p)}/11</small></button>`;}).join("")}</div>
  <div class="game">
    <div class="stack">
      <div class="panel stack"><div class="row" style="justify-content:space-between"><span class="lbl">Quadro de ${esc(vp.name)}</span><span class="note">${vp.revealed.length} de 26 abertos</span></div>${boardHTML(vp, viewingMine)}</div>
      ${viewingMine ? actionHTML(vp) : `<div class="panel"><p class="note" style="margin:0">${viewId===me ? "Espere a sua vez. Você pode olhar os times dos outros nas abas acima." : "Você está vendo o time de "+esc(vp.name)+"."}${vp.pending?" Letra da vez: <b>"+esc(vp.pending.letter)+"</b>.":""}</p></div>`}
    </div>
    <div class="stack">
      ${pitchHTML(vp, {interactive:viewingMine})}
      <div class="panel stack"><span class="lbl">Lances</span><ul class="log">${[...(r.log||[])].reverse().slice(0,8).map(l=>`<li>${esc(l.text)}</li>`).join("")}</ul></div>
    </div>
  </div>`;
}
function vDone(){
  const r=S.room, votes=r.votes||{}, tally={};
  Object.values(votes).forEach(t=>tally[t]=(tally[t]||0)+1);
  const myVote=votes[S.me];
  const online=S.mode==="online", host = online ? r.hostId===S.me : true;
  return `<div class="top"><div class="row"><h2 style="font-size:34px">Times escalados</h2></div><button class="btn ghost" data-act="leave">Sair</button></div>
  <p class="note" style="margin:0 0 14px">${online ? (myVote ? "Voto registrado. Dá para mudar até todo mundo votar." : "Qual time ficou melhor? Vote em um time que não seja o seu.") : "Qual time ficou melhor? Decidam aí na resenha."}</p>
  <div class="teams">${r.order.map(id=>{const p=r.players[id];return `<div class="panel team stack"><div class="row" style="justify-content:space-between"><div><h3>${esc(p.name)}</h3><span class="note">${Object.values(p.team||{}).filter(t=>t.ok!==false).length} de 11 na posição</span></div>${online?`<span class="votes">${tally[id]||0} voto${(tally[id]||0)===1?"":"s"}</span>`:""}</div>
    ${pitchHTML(p,{mini:true})}
    ${online && id!==S.me ? `<button class="btn ${myVote===id?"gold":""}" data-act="vote" data-id="${id}">${myVote===id?"Seu voto":"Votar neste time"}</button>`:""}</div>`;}).join("")}</div>
  <div class="panel stack" style="margin-top:16px"><span class="lbl">Posição por posição</span><div class="cmpwrap"><table class="cmp"><thead><tr><th>Posição</th>${r.order.map(id=>`<th>${esc(r.players[id].name)}</th>`).join("")}</tr></thead><tbody>${["gol","ld","zg1","zg2","le","vol","mc1","mc2","pd","pe","ca"].map(k=>{const pos=POS.find(x=>x.id===k);return `<tr><th>${pos.l}</th>${r.order.map(id=>{const t=r.players[id].team?.[k];return `<td class="${t&&t.ok===false?"offp":""}">${t?esc(t.n):"—"}${t&&t.ok===false?" <small>fora</small>":""}</td>`;}).join("")}</tr>`;}).join("")}</tbody></table></div></div>
  ${host ? `<div class="row" style="margin-top:16px"><button class="btn gold" data-act="rematch">Jogar de novo</button></div>` : ""}`;
}

/* ---------- events ---------- */
document.addEventListener("input", e => {
  const id=e.target.id;
  if(id==="name") S.ui.name=e.target.value;
  else if(id==="joinCode") S.ui.joinCode=e.target.value.toUpperCase();
  else if(id==="draft"){ S.ui.draft=e.target.value; const p=S.room?.players?.[actor()]; if(p){ const a=document.getElementById("sugg"), f=document.getElementById("fitnote"); if(a) a.innerHTML=suggHTML(p); if(f) f.innerHTML=fitHTML(p); } }
  else if(id==="localDraft") S.ui.localDraft=e.target.value;
});
document.addEventListener("keydown", e => {
  if(e.key!=="Enter") return;
  if(e.target.id==="localDraft"){ e.preventDefault(); act("addLocal"); }
  if(e.target.id==="joinCode"){ e.preventDefault(); act("join"); }
});
document.addEventListener("click", e => {
  const b=e.target.closest("[data-act]"); if(!b || b.disabled) return;
  act(b.dataset.act, b.dataset);
});
async function act(a, d={}){
  try{
    switch(a){
      case "create": S.ui.err=""; return createRoom();
      case "join": S.ui.err=""; return joinRoom();
      case "toLocal": S.screen="local"; S.ui.err=""; return render();
      case "home": S.screen="home"; S.ui.err=""; return render();
      case "addLocal": { const n=S.ui.localDraft.trim(); if(!n) return; if(S.ui.localNames.length>=8){ S.ui.err="Máximo de 8 jogadores."; return render(); } S.ui.localNames.push(n); S.ui.localDraft=""; S.ui.err=""; render(); document.getElementById("localDraft")?.focus(); return; }
      case "rmLocal": S.ui.localNames.splice(+d.i,1); return render();
      case "startLocal": return startLocal();
      case "start": return startGame();
      case "leave": return leave();
      case "view": S.view=d.id; return render();
      case "reveal": return reveal(+d.i);
      case "place": return place();
      case "aim": return setAim(d.pos);
      case "cReroll": return cardReroll();
      case "cPick": S.ui.pick = S.ui.pick===d.k ? null : d.k; return render();
      case "pickL": return cardPick(S.ui.pick, d.l);
      case "sugg": S.ui.draft=d.n; render(); return;
      case "free": return freeLetter(d.l);
      case "pass": return pass();
      case "skip": return skipTurn();
      case "vote": return vote(d.id);
      case "rematch": return rematch();
    }
  }catch(e){ console.error(e); }
}
render();
</script>
</body>
</html>
