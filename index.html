<meta name="theme-color" content="#0B0F14">
<meta name="description" content="Artilhetra: monte seu time de futebol com as letras que o quadro te der. Jogue online com os amigos ou contra o robô.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&display=swap">
<style>
/* Layout: estádio à noite — coluna única no celular; no desktop, quadro + ações à esquerda e campo à direita */
:root{
  --night:#0B0F14; --panel:#121821; --panel2:#1F2937; --grass:#0f5a33; --grass2:#12663a;
  --chalk:#E5E7EB; --muted:#9CA3AF; --line:rgba(229,231,235,.38);
  --gold:#D4AF37; --gold-hi:#F2D675; --gold-deep:#8A6A12; --ink:#0B0F14;
  --flag:#D4AF37; --flag-ink:#0B0F14; --ok:#16A34A; --bad:#F87171;
  --atk:#DC2626; --atk-hi:#F87171; --atk-deep:#7F1D1D;
  --silver:linear-gradient(180deg,#ffffff 0%,#d1d5db 45%,#9ca3af 55%,#f3f4f6 100%);
  --goldg:linear-gradient(180deg,#F7E08A 0%,#D4AF37 55%,#B08A1E 100%);
  --f-display:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-label:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(70% 40% at 12% -6%,rgba(255,244,214,.10),transparent 60%),radial-gradient(70% 40% at 88% -6%,rgba(255,244,214,.10),transparent 60%),linear-gradient(180deg,#0b1912 0%,var(--night) 45%);background-attachment:fixed;color:var(--chalk);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
#app{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.02em;text-wrap:balance;margin:0}
.lbl{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--muted);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input{font:inherit;color:var(--chalk);background:var(--night);border:1px solid #2c4a3a;border-radius:10px;padding:11px 12px;width:100%;min-width:0}
input::placeholder{color:#6f8a79}
.btn{border-radius:12px;padding:11px 16px;font-weight:700;background:var(--panel2);border:1px solid #2f5140;transition:transform .08s ease,box-shadow .15s ease,background .15s}
.btn:not(:disabled):active{transform:translateY(1px) scale(.99)}
.btn.gold{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--ink);border-color:var(--gold-deep);box-shadow:0 3px 0 var(--gold-deep),0 8px 18px rgba(230,184,76,.18)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 40%),var(--panel);border:1px solid #24402f;border-radius:16px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.err{color:var(--bad);font-weight:600;min-height:1.2em}
.note{color:var(--muted);font-size:14px}

/* Home */
.hero{padding:22px 0 6px;text-align:center;display:flex;flex-direction:column;align-items:center}
.hero h1{margin:0;line-height:1}
.hero .tag{max-width:46ch;color:var(--muted);margin:14px auto 0;font-size:16px}
.logo{display:inline-flex;align-items:center;gap:clamp(4px,1.4vw,10px);flex-wrap:wrap;justify-content:center}
.logo .chuta{font-family:var(--f-display);font-size:clamp(48px,14vw,104px);letter-spacing:.01em;color:var(--chalk);transform:skewX(-9deg);text-shadow:0 4px 0 #06100b,0 0 28px rgba(255,255,255,.12);position:relative}
.logo .chuta::before{content:"";position:absolute;left:-14%;top:30%;width:12%;height:6px;border-radius:3px;background:var(--flag);box-shadow:0 14px 0 var(--gold),0 28px 0 rgba(238,243,234,.5);transform:skewX(9deg)}
.logo .ball{width:clamp(34px,9vw,64px);height:clamp(34px,9vw,64px);animation:kick 2.6s cubic-bezier(.3,.7,.4,1) infinite}
.logo .ball svg{width:100%;height:100%;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45))}
.logo .letra{display:inline-flex;gap:clamp(3px,.9vw,6px)}
.logo .letra i{font-style:normal;font-family:var(--f-display);font-size:clamp(34px,10vw,74px);line-height:1;width:1.05em;height:1.18em;display:grid;place-items:center;border-radius:.16em;background:linear-gradient(170deg,var(--gold-hi),var(--gold) 60%,#c99a33);color:var(--ink);box-shadow:0 .08em 0 var(--gold-deep),0 .18em .3em rgba(0,0,0,.45);transform:rotate(calc((var(--i) - 2) * 3deg)) translateY(calc(var(--i) * -1px));animation:tile 2.6s ease-in-out infinite;animation-delay:calc(var(--i) * .06s)}
.logo .letra i:first-child{background:linear-gradient(170deg,var(--atk-hi),var(--flag));color:#fff;box-shadow:0 .08em 0 var(--atk-deep),0 .18em .3em rgba(0,0,0,.45)}
@keyframes kick{0%,55%,100%{transform:translateX(0) rotate(0)}62%{transform:translateX(-14px) rotate(-40deg)}72%{transform:translateX(8px) rotate(220deg)}}
@keyframes tile{0%,64%,100%{translate:0 0}70%{translate:0 -7px}}
@media (prefers-reduced-motion:reduce){.logo .ball,.logo .letra i{animation:none}}
.minilogo{font-family:var(--f-display);font-size:18px;letter-spacing:.02em;transform:skewX(-9deg);display:inline-block;margin-right:4px}
.minilogo b{font-weight:400;color:var(--gold-hi)}
.play .btn.big{display:flex;align-items:center;justify-content:center;gap:10px}
.btn .bi{width:22px;height:22px}
.twobtn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.twobtn .btn{padding:11px 8px}
.home-grid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:20px}
@media (min-width:820px){.home-grid{grid-template-columns:1.1fr .9fr;align-items:start}}
.rules ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:62ch}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:#2c4a3a}

/* Topbar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.code{font-family:var(--f-display);font-size:28px;letter-spacing:.14em;background:var(--chalk);color:var(--night);padding:2px 12px;border-radius:8px}
.turn{border-radius:14px;padding:14px 16px;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid #223a2e}
.turn.mine{background:linear-gradient(90deg,rgba(212,175,55,.28),rgba(212,175,55,.05));border-color:var(--flag);box-shadow:0 0 0 3px rgba(212,175,55,.12),0 10px 30px rgba(212,175,55,.12)}
.turn h2{font-size:26px}

/* Tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.tab{flex:0 0 auto;border:1px solid #2c4a3a;background:var(--panel);border-radius:999px;padding:7px 14px;font-weight:600;display:flex;gap:8px;align-items:center}
.tab[aria-pressed="true"]{background:var(--chalk);color:var(--night);border-color:var(--chalk)}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--flag)}
.tab small{font-family:var(--f-label);font-weight:700;opacity:.75}

.game{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:860px){.game{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}

/* Board of numbers */
.board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.tile{aspect-ratio:1;border-radius:9px;border:1px solid #2f5140;background:repeating-linear-gradient(135deg,#1f3a2d 0 6px,#1b3428 6px 12px);
  font-family:var(--f-display);font-size:clamp(16px,4.6vw,22px);display:grid;place-items:center;color:var(--chalk);padding:0}
.tile:not(:disabled):hover{border-color:var(--gold);transform:translateY(-1px)}
.tile.open{background:var(--chalk);color:var(--night);border-color:var(--chalk)}
.tile.open.cur{background:var(--goldg);border-color:var(--gold-hi);color:var(--ink)}
.tile.open.used{opacity:.55}
.tile:disabled{cursor:default}

/* Action */
.action{display:flex;flex-direction:column;gap:12px}
.bigletter{font-family:var(--f-display);font-weight:900;font-size:58px;line-height:1;width:84px;height:84px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(180deg,#1b2330,#0B0F14);color:#fff;border:2px solid var(--gold);box-shadow:0 0 0 4px rgba(212,175,55,.15),0 0 26px rgba(212,175,55,.35) inset;flex:0 0 auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.card{position:relative;border:0;padding:12px 6px 14px;background:linear-gradient(170deg,var(--gold-hi),var(--gold) 55%,#c99a33);color:var(--ink);
  border-radius:12px;border:1px solid var(--gold-deep);display:flex;flex-direction:column;align-items:center;gap:4px;min-height:104px}
.card svg{width:30px;height:30px}
.card b{font-family:var(--f-label);text-transform:uppercase;font-size:13px;line-height:1.05;letter-spacing:.03em}
.card[aria-pressed="true"]{background:linear-gradient(170deg,#fff,var(--gold-hi))}
.card:disabled{filter:grayscale(.8);opacity:.45;cursor:not-allowed}
.uses{display:flex;gap:6px;align-items:center}
.uses i{width:12px;height:12px;border-radius:3px;background:var(--gold);display:inline-block}
.uses i.off{background:#2c4a3a}
.letters{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px}
.letters button{border:1px solid #2c4a3a;background:var(--panel2);border-radius:7px;padding:7px 0;font-family:var(--f-display);font-size:18px}

/* Pitch */
.pitch{position:relative;width:100%;aspect-ratio:68/88;border-radius:14px;overflow:hidden;
  background:repeating-linear-gradient(180deg,var(--grass) 0 11.1%,var(--grass2) 11.1% 22.2%);border:2px solid #2d7a52}
.pitch .ln{position:absolute;border:2px solid var(--line);pointer-events:none}
.pitch .half{left:0;right:0;top:50%;border-width:2px 0 0}
.pitch .circ{left:50%;top:50%;width:26%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%)}
.pitch .boxT{left:24%;right:24%;top:-2px;height:15%}
.pitch .boxB{left:24%;right:24%;bottom:-2px;height:15%}

/* ===== identidade Artilhetra ===== */

.sheet{background:#121821;border-top-color:var(--gold)}
.card{background:var(--goldg)}
.atkcard{background:linear-gradient(170deg,var(--atk-hi),var(--atk))!important}
.pitch{border-color:rgba(255,255,255,.12);background:repeating-linear-gradient(180deg,#0f5a33 0 11.1%,#11653a 11.1% 22.2%)}
.slot{background:rgba(11,15,20,.6)}
.slot.full{background:rgba(11,15,20,.88)}
.hero-win{background:radial-gradient(120% 90% at 50% 0%,rgba(212,175,55,.32),transparent 60%),var(--panel);border-color:rgba(212,175,55,.45)}
.hero-win h1{background:var(--goldg);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
.onb{background:#121821;border-color:rgba(212,175,55,.4)}
.onbv .hl,.namev .bl{background:var(--goldg);border-color:var(--gold);color:var(--ink)}
.evt{background:#E5E7EB}

/* ===== logo e menu Artilhetra ===== */
:root{--slate:#64748B}
.brandlogo{width:min(520px,94vw);height:auto;display:block;margin:0 auto -6px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.6))}
.hero{padding-top:6px}
.minilogo{display:inline-flex;align-items:center;gap:6px;font-size:16px;letter-spacing:-.01em}
.minilogo img{width:26px;height:26px;border-radius:6px}
.play .btn.big,.play .btn.menu{clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);border-radius:4px;padding-left:22px;padding-right:22px}
.play .btn.menu{display:flex;align-items:center;justify-content:center;gap:10px}
.gi{width:20px;height:20px;color:var(--gold);flex:0 0 auto}
.btn:disabled .gi{color:var(--slate)}
.twobtn .btn{font-size:12.5px;padding:12px 18px}
.note{color:#a3acb9}

/* fundo liso, sem estádio */
body{background:var(--night)!important;background-image:none!important}

.twobtn{grid-template-columns:1fr}
.top{flex-wrap:nowrap}
.top>.row{flex-wrap:nowrap;min-width:0}
@media (max-width:380px){.minilogo span{display:none}}
.top .lbl{white-space:nowrap}
</style>

const RELATED = {vol:["MEI"], mc1:["VOL"], mc2:["VOL"], zg1:["LD","LE"], zg2:["LD","LE"], ld:["ZAG","LE"], le:["ZAG","LD"], pe:["CA"], pd:["CA"], ca:["PE","PD"]};
const SLOT_OK = {gol:["GOL"], ld:["LD"], le:["LE"], zg1:["ZAG"], zg2:["ZAG"], vol:["VOL","MC"], mc1:["MC","MEI"], mc2:["MC","MEI"], pe:["PE","PD"], pd:["PD","PE"], ca:["CA"]};
const normName = s => (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const PL = [], PALIAS = new Map();
PDATA.split("\n").forEach((ln,i) => {
  const [ns, ps, ov] = ln.split("|"); if(!ns) return;
  const e = { key:"p"+i, names:ns.split("/"), pos:(ps||"").split(","), ovr:+ov||80 };
  e.norms = e.names.map(normName);
  PL.push(e); e.norms.forEach(n => { if(!PALIAS.has(n)) PALIAS.set(n, e); });
});
/* sobrenome sozinho vale como apelido, se só um jogador da lista tiver esse sobrenome */
(() => {
  const PART = new Set(["de","da","do","dos","das","di","van","von","der","den","del","la","le","el","jr","junior","filho","neto"]);
  const cnt = new Map(), owner = new Map();
  PL.forEach(e => new Set(e.names.map(n => { const w=normName(n).split(" "); return w.length>1 && !PART.has(w[w.length-2]) ? w[w.length-1] : null; }).filter(x => x && x.length>=3 && !PART.has(x))).forEach(sn => { cnt.set(sn,(cnt.get(sn)||0)+1); owner.set(sn,e); }));
  cnt.forEach((c,sn) => { if(c!==1 || PALIAS.has(sn)) return; const e=owner.get(sn);
    const orig = e.names.map(n=>n.split(" ")).find(w=>w.length>1 && normName(w[w.length-1])===sn);
    const nm = orig ? orig[orig.length-1] : sn; e.names.push(nm); e.norms.push(sn); PALIAS.set(sn, e); });
})();
const lookup = name => PALIAS.get(normName(name)) || null;
const playerKey = name => lookup(name)?.key || "x:" + normName(name);
const fits = (e, slot) => !!e && e.pos.some(x => SLOT_OK[slot]?.includes(x));
const posText = e => e.pos.map(x => POS_NAME[x]).join(" / ");
/* overall na posição: perde 4 em lateral trocado, 8 fora de posição e vai a 45 com goleiro na linha ou jogador de linha no gol */
const UNKNOWN_OVR = 75;
const adapted = (e, slot) => !!e && !fits(e, slot) && !(slot==="gol") && !(e.pos.length===1 && e.pos[0]==="GOL") && e.pos.some(x => RELATED[slot]?.includes(x));
function effOvr(e, slot){
  if(!e) return UNKNOWN_OVR;
  if(fits(e, slot)) return e.ovr;
  const isGK = e.pos.includes("GOL");
  if(slot==="gol" || (isGK && e.pos.length===1)) return 45;
  if(adapted(e, slot)) return e.ovr-3;
  return e.ovr-8;
}
const slotOvr = t => t ? (t.v ?? UNKNOWN_OVR) : null;
function teamOvr(p){ const v=Object.values(p.team||{}).map(slotOvr); return v.length ? Math.round(v.reduce((a,b)=>a+b,0)/v.length) : null; }
const ovrTier = v => v>=90 ? "t1" : v>=85 ? "t2" : v>=78 ? "t3" : "t4";
function usedKeys(){ const k=new Set(); for(const id of S.room.order){ const t=S.room.players[id].team||{}; for(const s in t) k.add(playerKey(t[s].n)); } return k; }
function suggestions(letter, draft, slot){
  const q = normName(draft), used = usedKeys(), out = [];
  for(const e of PL){
    if(used.has(e.key)) continue;
    let best = -1;
    e.norms.forEach((n,i) => { if(n.charAt(0).toUpperCase()!==letter) return; if(q && !n.startsWith(q) && !n.includes(" "+q)) return; if(best<0) best=i; });
    if(best<0) continue;
    out.push({ e, name:e.names[best], fit:fits(e, slot) });
  }
  out.sort((a,b) => (b.fit-a.fit) || (b.e.ovr-a.e.ovr) || a.name.localeCompare(b.name, "pt"));
  return out.slice(0, 8);
}
const hintMode = () => S.room?.hints || "auto";
/* modo Sugestões: se existe jogador da posição com a letra, é obrigatório escolher um deles */
function fitCandidates(L, slot){ const used=usedKeys(); return PL.filter(e=>!used.has(e.key) && fits(e,slot) && e.norms.some(n=>n.charAt(0).toUpperCase()===L)); }
const mustFit = (p) => hintMode()==="full" && p?.pending && p.aim && fitCandidates(p.pending.letter, p.aim).length>0;
function suggHTML(p){
  if(hintMode()==="off") return "";
  if(hintMode()==="auto" && normName(S.ui.draft).length<3) return `<p class="note" style="margin:0">${S.ui.draft ? "Continue digitando: com 3 letras aparecem nomes parecidos." : "Pense num jogador e comece a digitar."}</p>`;
  const pend=p.pending; if(!pend || !p.aim) return "";
  const must = mustFit(p), lab=POS.find(x=>x.id===p.aim).l;
  const list = suggestions(pend.letter, S.ui.draft, p.aim).filter(x=>!must || x.fit);
  if(hintMode()==="full" && !S.ui.draft) {
    const head = must ? `<p class="note mustnote" style="margin:0">Modo Sugestões: escolha um jogador que joga de <b>${lab}</b>.</p>` : `<p class="note mustnote" style="margin:0">Ninguém da lista joga de <b>${lab}</b> com a letra ${esc(pend.letter)}. Pode escolher de outra posição.</p>`;
    if(list.length) return head + `<span class="lbl">Sugestões com ${esc(pend.letter)}</span><div class="sugg">${list.map(x=>`<button data-act="sugg" data-n="${esc(x.name)}" class="${x.fit?"fit":""}"><b><span class="ovrb ${ovrTier(x.e.ovr)}">${x.e.ovr}</span> ${esc(x.name)}</b><small>${x.name!==x.e.names[0]?esc(x.e.names[0])+" · ":""}${esc(posText(x.e))}</small></button>`).join("")}</div>`;
    return head;
  }
  if(!list.length) return `<p class="note" style="margin:0">${S.ui.draft ? "Nenhum jogador da lista com esse começo. Se ele existe, pode escalar assim mesmo." : "Nenhum jogador da lista com essa letra. Se você lembrar de algum, pode escalar assim mesmo."}</p>`;
  return `<span class="lbl">Sugestões com ${esc(pend.letter)}</span><div class="sugg">${list.map(x=>`<button data-act="sugg" data-n="${esc(x.name)}" class="${x.fit?"fit":""}"><b><span class="ovrb ${ovrTier(x.e.ovr)}">${x.e.ovr}</span> ${esc(x.name)}</b><small>${x.name!==x.e.names[0]?esc(x.e.names[0])+" · ":""}${esc(posText(x.e))}</small></button>`).join("")}</div>`;
}
function fitHTML(p){
  if(hintMode()==="off") return "";
  const name=S.ui.draft.trim(); if(!name || !p.aim) return "";
  const e=lookup(name), lab=POS.find(x=>x.id===p.aim).l;
  if(mustFit(p) && name.length>=3 && (!e || !fits(e,p.aim))) return `<span class="fit off">No modo Sugestões você tem que escolher alguém que joga de ${lab}.</span>`;
  if(!e) return name.length<3 ? "" : `<span class="fit unk">Não está na nossa lista. Vale se a galera concordar, e entra com overall ${UNKNOWN_OVR}.</span>`;
  const v=effOvr(e,p.aim);
  return fits(e,p.aim) ? `<span class="fit ok">Overall ${e.ovr}. Joga de ${esc(posText(e))}, está na posição.</span>` : (adapted(e,p.aim) ? `<span class="fit off">Overall ${e.ovr}. Joga de ${esc(posText(e))}, posição parecida: no ${lab} fica adaptado com ${v}.</span>` : `<span class="fit off">Overall ${e.ovr}, mas joga de ${esc(posText(e))}. Fora de posição no ${lab}, fica com ${v}.</span>`);
}

/* ---------- stores ---------- */
function localStore(){
  let data=null, ls=[];
  const emit = () => ls.forEach(f => f(clone(data), {fromCache:false}));
  return {
    get: async () => clone(data),
    set: async d => { data = clone(d); emit(); },
    update: async d => { data = merge(data, clone(d)); emit(); },
    listen: cb => { ls.push(cb); setTimeout(()=>cb(clone(data),{fromCache:false})); return () => { ls = ls.filter(x=>x!==cb); }; }
  };
}

/* ---------- conexão online (servidor público MQTT, funciona em 4G/5G/Wi-Fi) ---------- */
const BROKERS = ["wss://broker.emqx.io:8084/mqtt", "wss://broker.hivemq.com:8884/mqtt"];
const TOPIC = code => "alfabeto-embaralhado/v2/" + code;
let mq = null;
function connectBroker(pv){
  return new Promise((res, rej) => {
    if(!window.mqtt) return rej({type:"no-lib"});
    let i = 0;
    const tryNext = () => {
      if(i >= BROKERS.length) return rej({type:"net"});
      const url = BROKERS[i++];
      const c = mqtt.connect(url, { clientId:"ae_"+Math.random().toString(36).slice(2,10), clean:true, connectTimeout:8000, reconnectPeriod:2000, keepalive:30, ...(pv?{protocolVersion:pv}:{}) });
      let done=false;
      const t = setTimeout(()=>{ if(done) return; done=true; try{c.end(true);}catch(e){} tryNext(); }, 9000);
      c.once("connect", () => { if(done) return; done=true; clearTimeout(t); res(c); });
      c.once("error", () => { if(done) return; done=true; clearTimeout(t); try{c.end(true);}catch(e){} tryNext(); });
    };
    tryNext();
  });
}
function readRetained(c, code, ms){
  return new Promise(res => {
    const topic = TOPIC(code) + "/state"; let got=null;
    const h = (t, buf) => { if(t!==topic) return; try{ const m=JSON.parse(buf.toString()); if(m && m.d){ got=m.d; finish(); } }catch(e){} };
    const finish = () => { clearTimeout(tm); c.removeListener("message", h); c.unsubscribe(topic); res(got); };
    c.on("message", h); c.subscribe(topic, {qos:1});
    const tm = setTimeout(finish, ms);
  });
}
/* Anfitrião: guarda o estado da sala, recebe as jogadas e publica o estado para todos */
function hostStore(c, code, initial){
  let data=initial||null, ls=[];
  const T=TOPIC(code);
  const pub = () => c.publish(T+"/state", JSON.stringify({d:data, at:Date.now()}), {qos:1, retain:true});
  const emit = () => { ls.forEach(f=>f(clone(data),{fromCache:false})); pub(); };
  c.on("message", (t, buf) => { if(t!==T+"/patch" || !data) return; try{ const m=JSON.parse(buf.toString()); if(isObj(m.d)){ data=merge(data, m.d); emit(); } }catch(e){} });
  c.subscribe(T+"/patch", {qos:1});
  c.on("connect", () => { c.subscribe(T+"/patch", {qos:1}); if(data) pub(); });
  return {
    get: async () => clone(data),
    set: async d => { data=clone(d); emit(); },
    update: async d => { data=merge(data, clone(d)); emit(); },
    listen: cb => { ls.push(cb); setTimeout(()=>cb(clone(data),{fromCache:false})); return () => { ls=ls.filter(x=>x!==cb); }; },
    close: () => {}
  };
}
/* Convidado: recebe o estado e manda as jogadas para o anfitrião */
function guestStore(c, code, first){
  let data=first, ls=[];
  const T=TOPIC(code);
  c.on("message", (t, buf) => { if(t!==T+"/state") return; try{ const m=JSON.parse(buf.toString()); if(m && m.d){ data=m.d; ls.forEach(f=>f(clone(data),{fromCache:false})); } }catch(e){} });
  c.subscribe(T+"/state", {qos:1});
  c.on("connect", () => c.subscribe(T+"/state", {qos:1}));
  c.on("offline", () => { S.ui.net = "Sem internet no momento. Tentando reconectar…"; render(); });
  c.on("connect", () => { if(S.ui.net){ S.ui.net=""; render(); } });
  return {
    get: async () => clone(data),
    set: async d => { c.publish(T+"/patch", JSON.stringify({d}), {qos:1}); },
    update: async d => { c.publish(T+"/patch", JSON.stringify({d}), {qos:1}); },
    listen: cb => { ls.push(cb); setTimeout(()=>cb(clone(data),{fromCache:false})); return () => { ls=ls.filter(x=>x!==cb); }; }
  };
}
function waitFor(pred, ms){ return new Promise(res => { const t0=Date.now(); const iv=setInterval(()=>{ if(pred()){ clearInterval(iv); res(true); } else if(Date.now()-t0>ms){ clearInterval(iv); res(false); } }, 150); }); }
async function createRoom(){
  const name = S.ui.name.trim(); if(!name){ S.ui.err="Digite seu nome."; return render(); }
  lsSet("ae_name", name);
  S.mode="online"; S.ui.err="Criando a sala…"; render();
  try{ mq = await connectBroker(); }catch(e){ S.ui.err="Não consegui conectar ao servidor do jogo. Verifique a internet e tente de novo."; return render(); }
  let code=null;
  for(let i=0;i<4;i++){ const c=newCode(); const old=await readRetained(mq, c, 1200); if(!old || old.status==="done"){ code=c; break; } }
  if(!code){ S.ui.err="Não consegui criar a sala agora. Tente de novo."; return render(); }
  store=hostStore(mq, code, null);
  await store.set({ code, hostId:S.me, status:"lobby", createdAt:Date.now(), cardUses:2,
    players:{[S.me]:{name, joinedAt:Date.now()}}, order:[], turn:null, round:0, log:[], votes:{}, hints:"auto" });
  lsSet("ae_last", code);
  S.code=code; S.ui.err=""; subscribe();
}
async function joinRoom(){
  const name = S.ui.name.trim(); const code = S.ui.joinCode.trim().toUpperCase();
  if(!name){ S.ui.err="Digite seu nome."; return render(); }
  if(code.length!==4){ S.ui.err="O código da sala tem 4 letras."; return render(); }
  lsSet("ae_name", name);
  S.mode="online"; S.ui.err="Procurando a sala…"; render();
  try{ mq = await connectBroker(); }catch(e){ S.ui.err="Não consegui conectar ao servidor do jogo. Verifique a internet e tente de novo."; return render(); }
  const room = await readRetained(mq, code, 6000);
  if(!room){ try{mq.end(true);}catch(e){} mq=null; S.ui.err="Não encontrei a sala "+code+". Confira o código com o anfitrião."; return render(); }
  if(room.hostId===S.me){ /* o anfitrião voltou: retoma a sala de onde parou */
    store=hostStore(mq, code, room); S.code=code; S.ui.err=""; subscribe(); return;
  }
  store = guestStore(mq, code, room);
  if(!room.players?.[S.me]){
    if(room.status!=="lobby"){ try{mq.end(true);}catch(e){} mq=null; S.ui.err="Essa partida já começou. Peça para o anfitrião começar outra."; return render(); }
    await store.update({players:{[S.me]:{name, joinedAt:Date.now()}}});
    S.ui.err="Entrando…"; render();
    let ok=false; const un=store.listen(d=>{ if(d?.players?.[S.me]) ok=true; });
    const fine = await waitFor(()=>ok, 8000); un();
    if(!fine){ try{mq.end(true);}catch(e){} mq=null; S.ui.err="O anfitrião não respondeu. Ele precisa estar com o jogo aberto na tela."; return render(); }
  }
  S.code=code; S.ui.err=""; subscribe();
}

/* ---------- mural de times (24h, votação aberta) ---------- */
const MURAL = "alfabeto-embaralhado/v2/mural";
const DAY = 24*60*60*1000;
let muralC=null;
S.mural = { list:{}, votes:{}, status:"idle", focus:null };
async function muralConn(){
  if(muralC && muralC.connected) return muralC;
  try{ muralC = await connectBroker(5); }catch(e){ muralC = await connectBroker(4); }
  return muralC;
}
function muralPub(c, topic, obj){
  const opts={qos:1, retain:true};
  if(c.options?.protocolVersion===5) opts.properties={messageExpiryInterval:86400};
  c.publish(topic, JSON.stringify(obj), opts);
}
async function openMural(focus){
  S.screen="mural"; S.mural.focus=focus||null; render();
  if(S.mural.status==="ready" || S.mural.status==="loading") return;
  S.mural.status="loading"; render();
  let c; try{ c=await muralConn(); }catch(e){ S.mural.status="error"; return render(); }
  c.on("message", (t, buf) => {
    if(!t.startsWith(MURAL+"/")) return;
    const parts=t.slice(MURAL.length+1).split("/");
    let m=null; try{ m=JSON.parse(buf.toString()); }catch(e){ return; }
    if(parts[1]==="meta" && m && m.id && Date.now()-m.at < DAY) S.mural.list[m.id]=m;
    if(parts[1]==="v" && parts[2] && m && m.t){ (S.mural.votes[parts[0]] ||= {})[parts[2]]=m.t; }
    if(S.screen==="mural"){ clearTimeout(openMural.t); openMural.t=setTimeout(render, 120); }
  });
  c.subscribe([MURAL+"/+/meta", MURAL+"/+/v/+"], {qos:1});
  setTimeout(()=>{ S.mural.status="ready"; if(S.screen==="mural") render(); }, 1500);
}
async function publishMural(){
  const r=S.room; if(!r || r.status!=="done") return;
  if(r.published){ return openMural(r.published); }
  let c; try{ c=await muralConn(); }catch(e){ toast("Não consegui conectar ao mural agora. Tente de novo."); return; }
  const id=Math.random().toString(36).slice(2,9);
  const meta={ id, at:Date.now(), teams:r.order.map(pid=>{ const p=r.players[pid]; return { k:pid, name:p.name, bot:!!p.bot, ovr:teamOvr(p), team:Object.fromEntries(Object.entries(p.team||{}).map(([k,t])=>[k,{n:t.n, l:t.l, v:slotOvr(t), ok:t.ok, a:!!t.a, inj:!!t.inj}])) }; }) };
  muralPub(c, MURAL+"/"+id+"/meta", meta);
  S.mural.list[id]=meta;
  try{ await write({ published:id }); }catch(e){}
  toast("Publicado! Fica no mural por 24 horas.");
  openMural(id);
}

function buildStart(room){
  const r = clone(room);
  const ids = Object.keys(r.players).sort((a,b)=>(r.players[a].joinedAt||0)-(r.players[b].joinedAt||0));
  const order = shuffle(ids);
  ids.forEach(id => {
    const board = shuffle(AL.split(""));
    const cards = Array(26).fill(""), types = shuffle(["repeat","repeat","letter","letter","reroll","reroll","pos","pos","steal","expel","block","choosepos","injury","stealcard","skip","dey"]);
    shuffle([...Array(26).keys()]).slice(0,types.length).forEach((i,k) => cards[i] = types[k]);
    r.players[id] = { name:r.players[id].name, joinedAt:r.players[id].joinedAt, ...(r.players[id].bot?{bot:true, level:r.players[id].level||"medio"}:{}), board, cards, revealed:[], team:{}, hand:[], aim:null, pending:null };
  });

}

function nextTurnPatch(players){
  const r=S.room, order=r.order, i=order.indexOf(r.turn), skipped=[];
  for(let k=1;k<=order.length;k++){
    const cand = order[(i+k)%order.length];
    if(teamCount(players[cand])<11){
      if(r.skips?.[cand] && order.filter(x=>teamCount(players[x])<11).length>1){ skipped.push(cand); continue; }
      const out={ turn:cand, round: r.round + ((i+k)>=order.length ? 1 : 0) };
      if(skipped.length) out.skips = Object.fromEntries(skipped.map(x=>[x,null]));
      return out;
    }
  }
  return { status:"done", turn:null };
}

const ATK = ["steal","expel","block","choosepos","injury","stealcard","skip","dey"];
const deySlots = o => POS.filter(x => !(o.aim===x.id && !o.team?.[x.id]));
const deyPlaced = () => !!whoHas("Deyverson");
const isAtk = t => ATK.includes(t);

function atkTargets(k){
  const me=S.room.players[actor()];
  return others().filter(id => { const o=S.room.players[id];
    if(k==="steal") return teamCount(o)>0 && teamCount(me)>0;
    if(k==="expel" || k==="injury") return teamCount(o)>0 && (k!=="injury" || Object.values(o.team).some(t=>!t.inj));
    if(k==="choosepos") return teamCount(o)<11 && !o.forced;
    if(k==="stealcard") return validCards(o).length>0;
    if(k==="block") return (o.blocked||[]).length < 26;
    if(k==="dey") return !deyPlaced() && deySlots(o).length>0;
    return teamCount(o)<11;

}
function atkNote(to, text, k){ return { lastAtk:{to, text, k, at:Date.now()} }; }
async function atkDo(k, target, arg){
  const id=actor(), me=S.room.players[id], o=S.room.players[target];
  if(S.room.turn!==id || !o) return;
  const hand=useCard(me, k); if(!hand) return;
  S.ui.atk=null;
  let pl={[id]:{hand}}, extra={}, text="";
  if(k==="steal"){
    const [hs, ms]=String(arg||"").split(">"), his=o.team[hs], mine=me.team[ms]; if(!his || !mine) return;
    pl[id].team={[ms]:{...slotFor(his,ms), inj:his.inj||null}}; pl[target]={team:{[hs]:{...slotFor(mine,hs), inj:mine.inj||null}}};
    const lh=POS.find(x=>x.id===hs).l, lm=POS.find(x=>x.id===ms).l;
    text=me.name+" usou Roubar jogador: pegou "+his.n+" ("+lh+") de "+o.name+" e colocou no seu "+lm+"; em troca, "+mine.n+" foi para o "+lh+" de "+o.name;
  } else if(k==="expel"){
    const t=o.team[arg]; if(!t) return;
    pl[target]={team:{[arg]:null}};
    text=me.name+" usou Expulsão: "+t.n+" ("+POS.find(x=>x.id===arg).l+") foi expulso do time de "+o.name;
  } else if(k==="injury"){
    const t=o.team[arg]; if(!t) return;
    pl[target]={team:{[arg]:{inj:true, v:(t.v ?? UNKNOWN_OVR)-10}}};
    text=me.name+" usou Lesão: "+t.n+", de "+o.name+", perdeu 10 de overall";
  } else if(k==="block"){
    const L=[...new Set(arg)].slice(0,3); if(!L.length) return;
    pl[target]={blocked:[...new Set([...(o.blocked||[]), ...L])]};
    text=me.name+" usou Bloquear letras: "+o.name+" não pode mais usar "+L.join(", ")+" até o fim do jogo";
  } else if(k==="choosepos"){
    if(o.team[arg]) return;
    pl[target]={aim:arg, forced:true};
    text=me.name+" usou Escolher a posição: na próxima vez, "+o.name+" vai ter que escalar o "+POS.find(x=>x.id===arg).l;
  } else if(k==="stealcard"){
    const oh=validCards(o); if(!oh.length) return;
    const i=Math.floor(Math.random()*oh.length), c=oh.splice(i,1)[0];
    pl[id].hand=[...hand, {t:c.t, r:S.room.round}]; pl[target]={hand:oh};
    text=me.name+" usou Roubar cartinha e pegou a "+CARD_NAME[c.t]+" de "+o.name;
  } else if(k==="dey"){
    if(deyPlaced() || !POS.some(x=>x.id===arg)) return;
    const old=o.team[arg], lb=POS.find(x=>x.id===arg).l;
    pl[target]={team:{[arg]:{...slotFor({n:"Deyverson", l:"D"}, arg), o:lookup("Deyverson")?.ovr ?? 80, inj:null, dey:true}}};
    text=me.name+" usou Deyverson: o Deyverson entrou no "+lb+" de "+o.name+(old?" e "+old.n+" saiu do time":"");
  } else if(k==="skip"){
    extra.skips={[target]:true};
    text=me.name+" usou Perde a vez: "+o.name+" vai pular a próxima jogada";
  }
  await write({ players:pl, ...extra, log:logPatch(text), ...atkNote(target, text, k) });
  if(!S.botActing) showEvt("Cartinha usada!", text.replace(me.name+" usou ",""), k, "atk");
}

  }
  else if(k==="expel" || k==="injury") body = POS.filter(x=>o.team?.[x.id] && (k!=="injury" || !o.team[x.id].inj)).map(x=>`<button class="btn" data-act="atkGo" data-a="${x.id}">${x.l}: ${esc(o.team[x.id].n)} (${slotOvr(o.team[x.id])})</button>`).join("");
  else if(k==="dey") body = deySlots(o).map(x=>{ const t=o.team?.[x.id], v=effOvr(lookup("Deyverson"),x.id); return `<button class="btn" data-act="atkGo" data-a="${x.id}">${x.l}: ${t ? "tirar "+esc(t.n)+" ("+slotOvr(t)+")" : "vazio"} → Deyverson (${v})</button>`; }).join("");
  else if(k==="choosepos") body = POS.filter(x=>!o.team?.[x.id]).map(x=>`<button class="btn" data-act="atkGo" data-a="${x.id}">${x.l}</button>`).join("");
  else if(k==="block"){ const sel=a.letters||[], bl=o.blocked||[];
    body = `<div class="letters">${AL.split("").map(L=>`<button data-act="atkL" data-l="${L}" ${bl.includes(L)?"disabled":""} aria-pressed="${sel.includes(L)}" class="${sel.includes(L)?"on":""}">${L}</button>`).join("")}</div><button class="btn gold" data-act="atkGo" ${sel.length?"":"disabled"}>Bloquear ${sel.join(", ")||"letras"}</button>`; }
  else body = `<button class="btn gold" data-act="atkGo">Usar contra ${esc(o.name)}</button>`;
  const hint = k==="steal" ? (a.his ? "" : `Escolha qualquer jogador de ${esc(o.name)}. Depois você escolhe qualquer jogador seu para dar em troca.`) : k==="block" ? `Escolha até 3 letras que ${esc(o.name)} não vai poder usar até o fim do jogo.` : k==="choosepos" ? `Escolha a posição que ${esc(o.name)} vai ter que preencher na próxima vez.` : k==="dey" ? `O Deyverson entra no time de ${esc(o.name)} na posição que você escolher. Quem estiver lá sai do time.` : "";
  return `<div class="atkbox"><b>${CARD_NAME[k]} contra ${esc(o.name)}</b>${hint?`<p class="note" style="margin:0">${hint}</p>`:""}<div class="stack" style="gap:6px">${body}</div><button class="btn ghost" data-act="atkCancel">Cancelar</button></div>`;
}

/* ---------- robôs ---------- */
const BOT_NAMES = ["Robô Artilheiro","Robô Camisa 10","Robô Zagueirão","Robô Paredão","Robô Driblador","Robô Volantão","Robô Matador"];
const BOT_LEVEL = {facil:"Fácil", medio:"Médio", craque:"Craque"};
let botBusy=false;
const isBotTurn = () => !!S.room?.players?.[S.room.turn]?.bot;
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function nextBotName(existing){ const used=new Set(existing); return BOT_NAMES.find(n=>!used.has(n)) || "Robô "+(existing.length+1); }
function botPick(p, L, slot){
  if((p.blocked||[]).includes(L)) return null;
  const used=usedKeys(), out=[];
  for(const e of PL){
    if(used.has(e.key)) continue;
    const i=e.norms.findIndex(n=>n.charAt(0).toUpperCase()===L); if(i<0) continue;
    out.push({name:e.names[i], eff:effOvr(e,slot)});
  }
  if(!out.length) return null;
  out.sort((a,b)=>b.eff-a.eff);
  const lvl=p.level||"medio";
  if(lvl==="craque") return out[Math.random()<0.8?0:Math.min(1,out.length-1)];
  if(lvl==="facil"){ const pool=out.filter(x=>x.eff>=60); const src=pool.length?pool:out; return src[Math.floor(Math.random()*Math.min(src.length,30))]; }
  return out[Math.floor(Math.random()*Math.min(out.length,6))];
}
function botBestLetter(p, slot, letters){
  let best=null;
  for(const L of letters){ if((p.blocked||[]).includes(L)) continue; const c=botPick({...p, level:"craque"}, L, slot); if(c && (!best || c.eff>best.eff)) best={L, eff:c.eff}; }
  return best?.L || null;
}
async function botAttack(id){
  const p=S.room.players[id], hand=validCards(p).filter(c=>isAtk(c.t));
  if(!hand.length || Math.random()<0.35) return;
  const k=hand[0].t, tg=atkTargets(k); if(!tg.length) return;
  const target=tg.sort((a,b)=>(teamOvr(S.room.players[b])||0)*teamCount(S.room.players[b])-(teamOvr(S.room.players[a])||0)*teamCount(S.room.players[a]))[0];
  const o=S.room.players[target], me=S.room.players[id];
  let arg=null;
  const bestSlot = filter => POS.filter(x=>o.team?.[x.id] && filter(x)).sort((a,b)=>slotOvr(o.team[b.id])-slotOvr(o.team[a.id]))[0]?.id;
  if(k==="steal"){ let best=null; for(const h of POS.filter(x=>o.team?.[x.id])) for(const m of POS.filter(x=>me.team?.[x.id])){ const gain=slotFor(o.team[h.id],m.id).v-slotOvr(me.team[m.id]); if(!best || gain>best.g) best={g:gain, a:h.id+">"+m.id}; } arg=best && best.g>0 ? best.a : null; }
  else if(k==="expel") arg=bestSlot(()=>true);
  else if(k==="injury") arg=bestSlot(x=>!o.team[x.id].inj);
  else if(k==="choosepos"){ const empty=POS.filter(x=>!o.team?.[x.id]).map(x=>x.id); arg=empty.includes("gol")?"gol":empty[Math.floor(Math.random()*empty.length)]; }
  else if(k==="dey"){ const opts=deySlots(o).map(x=>x.id), filled=opts.filter(x=>o.team?.[x]).sort((a,b)=>slotOvr(o.team[b])-slotOvr(o.team[a])); arg=filled[0] || opts[0]; }
  else if(k==="block") arg=["R","M","C","D","A","S","L","P"].filter(L=>!(o.blocked||[]).includes(L)).sort(()=>Math.random()-0.5).slice(0,3);
  if(["steal","expel","injury","choosepos","dey"].includes(k) && !arg) return;
  await atkDo(k, target, arg); await sleep(900);
}
async function botTurn(id){
  const P=()=>S.room.players[id];
  S.botActing=id;
  try{
    await sleep(800);
    await botAttack(id);
    if(S.room.turn!==id) return;
    if(!P().aim){
      const empty=POS.filter(x=>!P().team?.[x.id]).map(x=>x.id); if(!empty.length) return;
      await setAim(empty[Math.floor(Math.random()*empty.length)]); await sleep(700);
    }
    for(let tries=0; tries<30 && !P().pending; tries++){
      const closed=[...Array(26).keys()].filter(i=>!P().revealed.includes(i));
      if(!closed.length){ const L=botBestLetter(P(), P().aim, AL.split("")); if(L) await freeLetter(L); break; }
      await reveal(closed[Math.floor(Math.random()*closed.length)]); await sleep(700);
    }
    if(!P().pending){ await pass(true); return; }
    let cand=botPick(P(), P().pending.letter, P().aim);
    const weak = c => !c || c.eff < 70;
    if(weak(cand) && hasCard(P(),"pos")){
      const L=P().pending.letter, opts=POS.filter(x=>!P().team?.[x.id] && x.id!==P().aim).map(x=>({id:x.id, c:botPick({...P(),level:"craque"},L,x.id)})).filter(o=>o.c).sort((a,b)=>b.c.eff-a.c.eff);
      if(opts.length && (!cand || opts[0].c.eff>cand.eff+5)){ await cardPos(opts[0].id); await sleep(700); cand=botPick(P(), L, P().aim); }
    }
    if(weak(cand) && hasCard(P(),"letter")){ const L=botBestLetter(P(), P().aim, AL.split("")); if(L){ await cardPick("letter", L); await sleep(700); cand=botPick(P(), P().pending.letter, P().aim); } }
    if(weak(cand) && hasCard(P(),"repeat") && pastLetters(P()).length){ const L=botBestLetter(P(), P().aim, pastLetters(P())); if(L){ await cardPick("repeat", L); await sleep(700); cand=botPick(P(), P().pending.letter, P().aim); } }
    if(!cand && hasCard(P(),"reroll")){
      await cardReroll(); await sleep(700);
      const closed=[...Array(26).keys()].filter(i=>!P().revealed.includes(i));
      if(closed.length){ await reveal(closed[Math.floor(Math.random()*closed.length)]); await sleep(700); }
      if(P().pending) cand=botPick(P(), P().pending.letter, P().aim);
    }
    await sleep(600);
    if(cand && P().pending){ S.ui.draft=cand.name; await place(cand.name); }
    else await pass(true);
  } finally { S.botActing=null; S.ui.draft=""; render(); }
}
function scheduleBot(){
  const r=S.room; if(!r || r.status!=="playing" || botBusy) return;
  if(!r.players[r.turn]?.bot) return;
  if(!(S.mode==="local" || r.hostId===S.me)) return;
  botBusy=true;
  setTimeout(async () => { try{ await botTurn(r.turn); }catch(e){ console.error(e); } botBusy=false; scheduleBot(); }, 400);
}

async function freeLetter(L){
  const id=actor(), p=S.room.players[id];
  await write({ players:{[id]:{ pending:{letter:L, idx:-1} }}, log:logPatch(p.name+" escolheu a letra "+L+" (o quadro acabou)") });
}
async function pass(force){
  const id=actor(), p=S.room.players[id];
  if(S.room.turn!==id) return;
  if((p.passes||0)>=1 && !force){ toast("Você já passou a vez nesta partida. Só pode uma vez."); return; }
  const players=clone(S.room.players); players[id]={...p, pending:null, aim:null, passes:(p.passes||0)+1};
  await write({ players:{[id]:{pending:null, aim:null, forced:null, passes:(p.passes||0)+1}}, log:logPatch(p.name+" passou a vez"+(p.pending?" com a letra "+p.pending.letter:"")), ...nextTurnPatch(players) });
}
async function skipTurn(){
  const id=S.room.turn, p=S.room.players[id];
  const players=clone(S.room.players); players[id]={...p, pending:null, aim:null};
  await write({ players:{[id]:{pending:null, aim:null}}, log:logPatch("O anfitrião pulou a vez de "+p.name), ...nextTurnPatch(players) });
}
async function vote(target){ await write({ votes:{[S.me]:target} }); }

/* ---------- render ---------- */
function render(){
  const a=document.activeElement, keep = a && a.id ? {id:a.id, s:a.selectionStart, e:a.selectionEnd} : null;
  const app=document.getElementById("app");
  app.innerHTML = S.screen==="mural" ? vMural() : S.screen==="home" ? vHome() : S.screen==="local" ? vLocal() : S.screen==="lobby" ? vLobby() : S.screen==="game" ? vGame() : vDone();
  app.insertAdjacentHTML("beforeend", evtHTML() + newCardHTML() + onbHTML());
  document.body.classList.toggle("withbar", !!app.querySelector(".cardbar"));
  if(keep){ const el=document.getElementById(keep.id); if(el){ el.focus(); try{ if(keep.s!=null) el.setSelectionRange(keep.s,keep.e); }catch(e){} } }
}

function titleHTML(){ return `<img class="brandlogo" src="${LOGO_SRC}" alt="Artilhetra, o artilheiro das palavras" width="576" height="322">`; }
function rulesHTML(){
  return `<div class="panel rules"><div class="lbl">Como funciona</div>
  <ul class="quick"><li><b>1.</b> Escolha a posição no campo.</li><li><b>2.</b> Abra um número e veja a letra.</li><li><b>3.</b> Escale um jogador com essa inicial.</li><li><b>4.</b> Use as cartinhas para se ajudar ou atrapalhar os outros.</li><li><b>5.</b> Vence o time com maior overall.</li></ul>
  <button class="btn" data-act="onb">Ver como jogar em 5 passos</button>
  <details class="fold"><summary>Regras completas</summary><ol>
    <li>Cada jogador tem um quadro com os números de 1 a 26. Atrás deles estão as 26 letras do alfabeto, embaralhadas de um jeito diferente para cada um.</li>
    <li>Na sua vez, <b>escolha primeiro a posição</b> no campo (4-3-3). Depois abra um número: a letra que sair é a inicial do jogador que vai nessa posição.</li>
    <li>Digite o nome de um jogador de futebol com essa inicial e escale. Não vale repetir jogador: quem já foi escalado por alguém não pode entrar de novo. Vale qualquer nome pelo qual o jogador é conhecido: o Messi entra com M (Messi) ou com L (Lionel ou Leo Messi). O jogo sugere nomes de uma lista com mais de 1.600 jogadores, cada um com o overall do auge da carreira. Em posição parecida (volante e meia, lateral e zagueiro, ponta e centroavante, lateral trocado de lado) o jogador fica <b>adaptado</b> e perde 3 pontos. Fora de posição perde 8, e goleiro na linha ou jogador de linha no gol cai para 45. O overall do time é a média dos 11.</li>
    <li>Dezesseis números do quadro trazem, junto com a letra, uma <b>cartinha</b>: 8 de ajuda (2 de cada) e 8 de ataque contra os adversários (1 de cada). A cartinha <b>Deyverson</b> é única na partida: quem tirar primeiro leva, e os outros perdem a sua. Todas estão explicadas abaixo. Você pode usar na hora ou guardar para a próxima rodada.</li>
    <li>Se não lembrar de ninguém, dá para <b>passar a vez</b>, mas só <b>uma vez por partida</b> e você perde a letra.</li>
    <li>Quando todo mundo completar os 11, os times são comparados posição por posição e cada um vota no melhor time (não vale votar no seu).</li>
  </ol>
  <div class="lbl" style="margin-top:14px">Cartinhas de ajuda (2 de cada)</div>
  <div class="cardhelp">${["repeat","letter","reroll","pos"].map(k=>`<div class="ch"><span class="chi">${CARD_ICONS[k]}</span><div><b>${CARD_NAME[k]}</b><p>${CARD_DESC[k]}</p><small>Quando usar: ${CARD_WHEN[k].toLowerCase()}</small></div></div>`).join("")}</div>
  <div class="lbl" style="margin-top:14px">Cartinhas de ataque (1 de cada)</div>
  <div class="cardhelp">${ATK.map(k=>`<div class="ch"><span class="chi atk">${CARD_ICONS[k]}</span><div><b>${CARD_NAME[k]}</b><p>${CARD_DESC[k]}</p><small>Quando usar: na sua vez, sem gastar a jogada.</small></div></div>`).join("")}</div>
  <p class="note" style="margin:8px 0 0">Cada cartinha vale na rodada em que saiu e na seguinte. Depois disso, some da sua mão. Quem recebe um ataque é avisado na hora.</p>
  </details></div>`;
}
function vHome(){
  const online = !!window.mqtt;
  return `<header class="hero"><h1>${titleHTML()}</h1>
    <p class="tag">Saiu a letra, chuta o craque. Monte seu time com as letras escondidas no quadro e prove que entende de bola.</p></header>
  <div class="home-grid">
    <div class="panel stack play">
      <label class="stack" style="gap:6px"><span class="lbl">Seu nome no jogo</span>
        <input id="name" maxlength="18" placeholder="Ex.: Igão" value="${esc(S.ui.name)}" autocomplete="nickname"></label>
      <button class="btn gold big" data-act="vsBot"><svg class="bi" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z" fill="currentColor"/></svg>Jogar contra o robô</button>
      <div class="divider">com a galera</div>
      ${!online ? '<p class="note">Carregando o modo online… Se demorar, recarregue a página. Enquanto isso dá para jogar contra o robô ou num aparelho só.</p>' : ''}
      <button class="btn big menu" data-act="create" ${online?"":"disabled"}><svg class="gi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21v-1a6 6 0 0 1 12 0v1M16 3.5a4 4 0 0 1 0 7M22 21v-1a6 6 0 0 0-4-5.6"/></svg>Criar sala online</button>
      <div class="row joinrow" style="flex-wrap:nowrap">
        <input id="joinCode" maxlength="4" placeholder="Código da sala" style="text-transform:uppercase;letter-spacing:.2em;font-weight:700" value="${esc(S.ui.joinCode)}">
        <button class="btn" data-act="join" ${online?"":"disabled"}>Entrar</button>
      </div>
      <div class="err" role="alert">${esc(S.ui.err)}</div>
      <div class="row twobtn"><button class="btn menu" data-act="toLocal"><svg class="gi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg>Num aparelho só</button><button class="btn menu" data-act="muralOpen"><svg class="gi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Mural e votação</button></div>
    </div>
    ${rulesHTML()}
  </div>`;
}
function vLocal(){
  return `<div class="top"><h2 style="font-size:30px">Num aparelho só</h2><button class="btn ghost" data-act="home">Voltar</button></div>
  <div class="panel stack" style="max-width:560px">
    <p class="note">Adicione quem vai jogar. Na vez de cada um, o celular passa de mão em mão. Para jogar sozinho, coloque o seu nome e adicione um ou mais robôs.</p>
    <div class="row" style="flex-wrap:nowrap"><input id="localDraft" maxlength="18" placeholder="Nome do jogador" value="${esc(S.ui.localDraft)}"><button class="btn" data-act="addLocal">Adicionar</button></div>
    <div class="stack" style="gap:6px"><span class="lbl">Adicionar robô</span><div class="row">${Object.entries(BOT_LEVEL).map(([k,v])=>`<button class="btn" data-act="addBotLocal" data-l="${k}">Robô ${v}</button>`).join("")}</div></div>
    <ul class="plist">${S.ui.localNames.map((n,i)=>`<li><span>${esc(n.name)}${n.bot?` <span class="lbl">robô ${BOT_LEVEL[n.level]}</span>`:""}</span><button class="btn ghost" data-act="rmLocal" data-i="${i}" aria-label="Remover ${esc(n.name)}">Remover</button></li>`).join("") || '<li class="note">Ninguém ainda.</li>'}</ul>
    <div class="stack" style="gap:6px"><span class="lbl">Ajuda para escalar</span><div class="seg">${[["off","Sem dicas"],["auto","Autocompletar"],["full","Sugestões"]].map(([k,v])=>`<button data-act="hintsLocal" data-v="${k}" aria-pressed="${(S.ui.hints||"auto")===k}">${v}</button>`).join("")}</div><p class="note" style="margin:0">${({off:"Ninguém vê nomes: cada um tem que lembrar e digitar.",auto:"Os nomes aparecem só depois de digitar 3 letras.",full:"Mostra sugestões assim que a letra sai e obriga a escolher alguém da posição, se existir."})[(S.ui.hints||"auto")]}</p></div>
    <div class="err" role="alert">${esc(S.ui.err)}</div>
    <button class="btn gold" data-act="startLocal" ${S.ui.localNames.length<2?"disabled":""}>Começar partida</button>
  </div>`;
}
function vLobby(){
  const r=S.room, host=r.hostId===S.me;
  const ids=Object.keys(r.players).sort((a,b)=>r.players[a].joinedAt-r.players[b].joinedAt);
  return `<div class="top"><div class="row"><span class="lbl">Sala</span><span class="code">${esc(r.code)}</span></div><button class="btn ghost" data-act="leave">Sair</button></div>
  ${S.ui.net?`<p class="err">${esc(S.ui.net)}</p>`:""}
  <div class="home-grid">
    <div class="panel stack">
      <div><h2 style="font-size:30px">Esperando a galera</h2><p class="note" style="margin:6px 0 0">Passe o código <b>${esc(r.code)}</b> para os amigos. Eles abrem esta mesma página, colocam o nome e entram.</p></div>
      <ul class="plist">${ids.map(id=>`<li><span>${esc(r.players[id].name)}${id===S.me?" (você)":""}${r.players[id].bot?` <span class="lbl">robô ${BOT_LEVEL[r.players[id].level]||""}</span>`:""}</span>${id===r.hostId?'<span class="lbl">anfitrião</span>':""}${host && r.players[id].bot?`<button class="btn ghost" data-act="rmBotRoom" data-id="${id}">Remover</button>`:""}</li>`).join("")}</ul>
      ${host ? `<div class="stack" style="gap:6px"><span class="lbl">Ajuda para escalar</span><div class="seg">${[["off","Sem dicas"],["auto","Autocompletar"],["full","Sugestões"]].map(([k,v])=>`<button data-act="hintsRoom" data-v="${k}" aria-pressed="${(r.hints||"auto")===k}">${v}</button>`).join("")}</div><p class="note" style="margin:0">${({off:"Ninguém vê nomes: cada um tem que lembrar e digitar.",auto:"Os nomes aparecem só depois de digitar 3 letras.",full:"Mostra sugestões de jogadores assim que a letra sai."})[(r.hints||"auto")]}</p></div>` : `<p class="note" style="margin:0">Ajuda para escalar: <b>${({off:"Sem dicas",auto:"Autocompletar",full:"Sugestões"})[r.hints||"auto"]}</b></p>`}
      ${host ? `<div class="stack" style="gap:6px"><span class="lbl">Adicionar robô</span><div class="row">${Object.entries(BOT_LEVEL).map(([k,v])=>`<button class="btn" data-act="addBotRoom" data-l="${k}">Robô ${v}</button>`).join("")}</div><p class="note" style="margin:0">Os robôs jogam pelo seu celular, então deixe o jogo aberto até o fim.</p></div>` : ""}
      ${host ? `<button class="btn gold" data-act="start">Começar com ${ids.length} jogador${ids.length>1?"es":""}</button>` : '<p class="note">O anfitrião começa a partida quando todos entrarem.</p>'}
    </div>
    ${rulesHTML()}
  </div>`;
}
function pitchHTML(p, opts={}){
  const {interactive=false, mini=false} = opts;
  const pend = p.pending;
  return `<div class="pitch ${mini?"mini":""}"><div class="ln half"></div><div class="ln circ"></div><div class="ln boxT"></div><div class="ln boxB"></div>
    ${POS.map(pos=>{
      const t=p.team?.[pos.id], aimed = interactive && p.aim===pos.id;
      const mode = interactive ? (S.ui.pick==="swap" ? "swap" : (S.ui.pick==="pos" && pend ? "pos" : "aim")) : null;
      const can = mode==="swap" ? !!t : mode==="pos" ? !t : (interactive && !pend && !t);
      const act = mode==="swap" ? "swapsel" : mode==="pos" ? "reaim" : "aim";
      const sel = mode==="swap" && S.ui.swapA===pos.id;
      return `<button class="slot ${t?"full":""} ${t&&t.ok===false?"off":""} ${t&&t.a?"adapt":""} ${can?"can":""} ${aimed||sel?"aim":""}" ${can?`data-act="${act}" data-pos="${pos.id}"`:"disabled"} style="left:${pos.x}%;top:${pos.y}%" aria-pressed="${aimed?"true":"false"}" aria-label="${pos.l}${t?": "+esc(t.n):" vazia"}">

document.addEventListener("input", e => {

document.addEventListener("keydown", e => {
  if(e.key!=="Enter") return;
  if(e.target.id==="localDraft"){ e.preventDefault(); act("addLocal"); }

  if(e.target.classList?.contains("oth")){ e.preventDefault(); act("view", e.target.dataset); }
});
document.addEventListener("click", e => {
  const b=e.target.closest("[data-act]"); if(!b || b.disabled) return;

const GAME_ACTS = new Set(["aim","reveal","place","cReroll","cPick","pickL","pass","free","reaim","swapsel","atk","atkTo","atkL","atkGo","sugg"]);
async function act(a, d={}){
  if(GAME_ACTS.has(a) && S.room && isBotTurn() && !S.botActing){ toast("Calma, é a vez do robô."); return; }
  try{
    switch(a){
      case "create": S.ui.err=""; return createRoom();
      case "join": S.ui.err=""; return joinRoom();
      case "toLocal": S.screen="local"; S.ui.err=""; return render();
      case "muralOpen": return openMural(d.id);
      case "sheet": S.ui.sheet=true; S.ui.pulse=false; return render();
      case "ncKeep": S.ui.newCard=null; return render();
      case "ncUse": S.ui.newCard=null; S.ui.sheet=true; S.ui.pulse=false; return render();
      case "sheetClose": S.ui.sheet=false; S.ui.atk=null; if(S.ui.pick!=="pos") S.ui.pick=null; return render();
      case "evtClose": S.ui.evt=null; return render();
      case "cancelPick": S.ui.pick=null; return render();
      case "unaim": { const p=S.room.players[actor()]; if(p.forced || p.pending) return; await write({players:{[actor()]:{aim:null}}}); return; }
      case "onb": S.ui.onb=0; return render();
      case "onbNext": S.ui.onb=Math.min(ONB.length-1,(S.ui.onb||0)+1); return render();
      case "onbPrev": S.ui.onb=Math.max(0,(S.ui.onb||0)-1); return render();
      case "onbEnd": S.ui.onb=null; lsSet("ae_onb","1"); return render();
      case "hintsLocal": S.ui.hints=d.v; return render();
      case "hintsRoom": if(S.room?.hostId===S.me) await write({hints:d.v}); return;
      case "muralPublish": return publishMural();
      case "muralVote": return voteMural(d.id, d.k);
      case "muralCopy": return copyMural(d.id);
      case "home": if(S.screen==="mural" && S.room){ S.screen = S.room.status==="done"?"done":S.room.status==="playing"?"game":"lobby"; if(location.hash) history.replaceState(null,"",location.pathname); return render(); } S.screen="home"; S.ui.err=""; if(location.hash) history.replaceState(null,"",location.pathname); return render();
      case "addBotLocal": { if(S.ui.localNames.length>=8){ S.ui.err="Máximo de 8 jogadores."; return render(); } S.ui.localNames.push({name:nextBotName(S.ui.localNames.map(x=>x.name)), bot:true, level:d.l}); S.ui.err=""; return render(); }
      case "vsBot": { const me=(S.ui.name||"").trim()||"Você"; S.ui.localNames=[{name:me},{name:nextBotName([]), bot:true, level:"medio"}]; S.screen="local"; S.ui.err=""; return render(); }
      case "addBotRoom": { const r=S.room; if(!r || r.hostId!==S.me) return; const ids=Object.keys(r.players); if(ids.length>=8){ toast("Máximo de 8 jogadores."); return; } const id="bot"+Math.random().toString(36).slice(2,8); await write({players:{[id]:{name:nextBotName(ids.map(x=>r.players[x].name)), bot:true, level:d.l, joinedAt:Date.now()}}}); return; }
      case "rmBotRoom": { if(S.room?.hostId!==S.me) return; await write({players:{[d.id]:null}}); return; }
      case "addLocal": { const n=S.ui.localDraft.trim(); if(!n) return; if(S.ui.localNames.length>=8){ S.ui.err="Máximo de 8 jogadores."; return render(); } S.ui.localNames.push({name:n}); S.ui.localDraft=""; S.ui.err=""; render(); document.getElementById("localDraft")?.focus(); return; }
      case "rmLocal": S.ui.localNames.splice(+d.i,1); return render();
      case "startLocal": return startLocal();
      case "start": return startGame();
      case "leave": return leave();
      case "view": S.view=d.id; return render();
      case "reveal": return reveal(+d.i);
      case "place": return place();
      case "aim": return setAim(d.pos);
      case "cReroll": S.ui.sheet=false; return cardReroll();
      case "cPick": S.ui.pick = S.ui.pick===d.k ? null : d.k; S.ui.swapA=null; if(d.k==="pos" && S.ui.pick) S.ui.sheet=false; return render();
      case "reaim": return cardPos(d.pos);
      case "atk": S.ui.atk = S.ui.atk?.k===d.k ? null : {k:d.k}; S.ui.pick=null; return render();
      case "atkTo": S.ui.atk = {...S.ui.atk, to:d.id, letters:[], his:null}; return render();
      case "atkPick": S.ui.atk = {...S.ui.atk, his:d.a||null}; return render();
      case "atkL": { const a=S.ui.atk; const set=new Set(a.letters||[]); set.has(d.l)?set.delete(d.l):(set.size<3&&set.add(d.l)); a.letters=[...set]; return render(); }
      case "atkGo": S.ui.sheet=false; return atkDo(S.ui.atk.k, S.ui.atk.to, S.ui.atk.k==="block" ? S.ui.atk.letters : d.a);
      case "atkCancel": S.ui.atk=null; return render();
      case "swapsel": return cardSwap(d.pos);
      case "pickL": S.ui.sheet=false; return cardPick(S.ui.pick, d.l);
      case "sugg": S.ui.draft=d.n; render(); return;
      case "free": return freeLetter(d.l);
      case "pass": return pass();
      case "skip": return skipTurn();
      case "vote": return vote(d.id);
      case "rematch": return rematch();
    }
  }catch(e){ console.error(e); }
}
window.addEventListener("mqtt-ready", ()=>{ if(S.screen==="home") render(); });
if(!lsGet("ae_onb") && !/^#mural/.test(location.hash)) S.ui.onb=0;
render();
if(/^#mural/.test(location.hash)) openMural(location.hash.slice(7)||null);
window.addEventListener("hashchange", ()=>{ if(/^#mural/.test(location.hash)) openMural(location.hash.slice(7)||null); });
</script>
</body>
</html>
